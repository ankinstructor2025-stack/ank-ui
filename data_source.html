<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>データ取得</title>
  <link rel="stylesheet" href="./theme.css">
</head>
<body>

<div class="page">
  <div class="card">

    <div class="header-row">
      <h2>データ取得</h2>

      <div class="header-actions">
        <button id="btnMenu" class="btn" type="button">メニュー</button>
        <button id="btnLogout" class="btn" type="button">ログアウト</button>
      </div>
    </div>

    <div class="common-panel">
      <div class="common-grid">
        <div>
          <label for="sourceSelect">取得元</label>
          <select id="sourceSelect"></select>
        </div>

        <div>
          <label for="sourceName">名称</label>
          <input id="sourceName" readonly>
        </div>
      </div>
    </div>

    <div class="work-panel">

      <div id="panelEmpty" class="placeholder">
        取得元を選択してください
      </div>

      <div id="panelKokkai" class="hidden">
        <h3 class="panel-title">国会議事録取得</h3>
        <div class="compact-actions">
          <button id="btnKokkaiRegister" class="btn btn-primary" type="button">
            国会議事録取得
          </button>
        </div>
      </div>

      <div id="panelUpload" class="hidden">
        <h3 class="panel-title">ファイルアップロード</h3>

        <div class="section-block">
          <label for="uploadFileInput">ファイル</label>
          <input id="uploadFileInput" type="file">

          <div class="compact-actions">
            <button id="btnUploadRegister" class="btn btn-primary" type="button">
              アップロード
            </button>
          </div>
        </div>
      </div>

      <div id="panelOpenData" class="hidden">
        <h3 class="panel-title">オープンデータ取得</h3>

        <div class="section-block">
          <div class="compact-actions">
            <button id="btnFetchDatasets" class="btn btn-primary" type="button">
              データセット取得
            </button>
          </div>

          <div class="dataset-list-wrap">
            <div id="openDataDatasetList" class="placeholder">
              まだ取得していません
            </div>
          </div>
        </div>

        <div class="section-block">
          <div class="resource-list-wrap">
            <div id="openDataResourceList" class="placeholder">
              まだ分解していません
            </div>
          </div>
        </div>
      </div>

    </div>

    <div class="log" id="logBox">
      <div class="log-head">
        <strong>ログ</strong>
        <button id="btnClearLog" class="btn" type="button">クリア</button>
      </div>
      <pre id="logText"></pre>
    </div>

  </div>
</div>

<script src="./data_source_upload.js"></script>
<script src="./data_source_kokkai.js"></script>
<script src="./data_source_opendata.js"></script>
<script src="./data_source.js"></script>

</body>
</html>
