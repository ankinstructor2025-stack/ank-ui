<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>データ取得</title>
  <link rel="stylesheet" href="./theme.css">
  <link rel="stylesheet" href="./data_source.css">
</head>
<body>

<div id="dataSourcePage" class="page ds-page">
  <div id="dataSourceCard" class="card ds-card">
    <div class="ds-wrap">

      <div id="pageToolbar"></div>

      <div class="main-area">
        <div class="work-panel">
          <div id="panelKokkai" class="hidden">
            <h3 class="panel-title">国会議事録取得</h3>

            <div class="section-block">
              <div class="compact-actions">
                <button id="btnKokkaiRegister" class="btn btn-primary" type="button">
                  国会議事録取得
                </button>
              </div>
            </div>
          </div>

          <div id="panelUpload" class="hidden">
            <h3 class="panel-title">ファイルアップロード</h3>

            <div class="section-block">
              <div>
                <label for="uploadFileInput">ファイル</label>

                <div class="upload-file-row">
                  <input id="uploadFileInput" class="upload-file-input" type="file">

                  <label for="uploadFileInput" class="upload-file-btn">
                    ファイルの選択
                  </label>

                  <div id="uploadFileName" class="upload-file-name is-empty">
                    ファイルが選択されていません
                  </div>
                </div>
              </div>

              <div class="compact-actions">
                <button id="btnUploadRegister" class="btn btn-primary" type="button">
                  アップロード
                </button>
              </div>
            </div>
          </div>

          <div id="panelOpenData" class="hidden">
            <div class="section-block">
              <div class="compact-actions">
                <button id="btnFetchDatasets" class="btn btn-primary" type="button">
                  データセット取得
                </button>
              </div>

              <div class="dataset-list-wrap">
                <div id="openDataDatasetList" class="placeholder">
                  まだ取得していません
                </div>
              </div>
            </div>
          </div>

          <div id="panelUrl" class="hidden">
            <h3 class="panel-title">公開URL取得</h3>

            <div class="section-block ds-section-fixed">
              <div>
                <label for="publicUrlTarget">取得元URL</label>
                <textarea id="publicUrlTarget" rows="2" readonly></textarea>
              </div>

              <div class="compact-actions">
                <button id="btnUrlRegister" class="btn btn-primary" type="button">
                  公開URL取得
                </button>
              </div>
            </div>

            <div class="section-block">
              <h4 class="panel-subtitle">子URL一覧</h4>
              <div class="resource-list-wrap">
                <div id="publicUrlPageList" class="placeholder">
                  まだ取得していません
                </div>
              </div>
            </div>
          </div>

        </div>

        <div class="log hidden" id="logBox">
          <div class="log-head">
            <strong>ログ</strong>
            <button id="btnClearLog" class="btn" type="button">クリア</button>
          </div>
          <pre id="logText"></pre>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="./common_toolbar.js"></script>
<script src="./data_source_upload.js"></script>
<script src="./data_source_kokkai.js"></script>
<script src="./data_source_opendata.js"></script>
<script src="./data_source_url.js"></script>
<script src="./data_source.js"></script>

<script>
renderPageToolbar({
  mountId: "pageToolbar",
  title: "データ取得",
  showSourceSelect: true,
  showDbSelect: false,
  enableDbAutoLoad: false,
  actions: [
    { id: "btnMenu", label: "メニュー" },
    { id: "btnLogout", label: "ログアウト" }
  ]
});
</script>

</body>
</html>
