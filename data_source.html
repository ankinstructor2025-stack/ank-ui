<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>データ取り込み（デモ）</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="center-wrap">
    <div class="card">
      <h1>データ取り込み（デモ）<span class="badge">7ソース固定</span></h1>

      <label for="sourceSelect">データ取得元を選択</label>
      <select id="sourceSelect">
        <option value="" selected disabled>選択してください</option>

        <optgroup label="公開API">
          <option value="api_kokkai">国会会議録API（国会議事録）</option>
          <option value="api_datago">data.go.jp（政府オープンデータ）</option>
          <option value="api_jma">気象庁（防災・気象）</option>
        </optgroup>

        <optgroup label="公開URL">
          <option value="url_egov">e-Gov（法令・制度ページ）</option>
          <option value="url_caa">消費者庁（FAQページ）</option>
          <option value="url_tokyo">東京都（オープン情報ページ）</option>
        </optgroup>

        <optgroup label="ダウンロード">
          <option value="file_upload">ファイルアップロード（csv/txt/json）</option>
        </optgroup>
      </select>
      <div class="subtitle">選択すると下の設定フォームが切り替わります（デモ）。</div>

      <!-- 共通：名称 -->
      <div id="commonFields" class="hidden">
        <label for="sourceName">名称（表示名）</label>
        <input id="sourceName" placeholder="例）国会会議録（AI関連）" />
      </div>

      <!-- APIフォーム -->
      <div id="formApi" class="hidden">
        <div class="row">
          <div>
            <label for="apiEndpoint">API URL</label>
            <input id="apiEndpoint" />
          </div>
          <div>
            <label for="apiSchedule">取得間隔（デモ）</label>
            <select id="apiSchedule">
              <option value="manual">手動</option>
              <option value="daily">毎日</option>
              <option value="weekly">毎週</option>
            </select>
          </div>
        </div>

        <label for="apiParams">パラメータ（JSON）</label>
        <textarea id="apiParams" placeholder='例）{"keyword":"AI","maximumRecords":200}'></textarea>
      </div>

      <!-- URLフォーム -->
      <div id="formUrl" class="hidden">
        <label for="targetUrl">URL</label>
        <input id="targetUrl" placeholder="https://..." />

        <label for="urlMode">取得タイプ（デモ）</label>
        <select id="urlMode">
          <option value="html">HTML</option>
          <option value="json">JSON</option>
        </select>

        <label for="urlHint">抽出ヒント（任意）</label>
        <input id="urlHint" placeholder="例）FAQ / 見出し / 章タイトル など" />
      </div>

      <!-- ファイルフォーム -->
      <div id="formFile" class="hidden">
        <label for="fileInput">ファイル</label>
        <input id="fileInput" type="file" accept=".csv,.txt,.json" />
        <div class="subtitle">PDF/画像は対象外（現方針）。</div>
      </div>

      <!-- actions -->
      <div class="actions hidden" id="actions">
        <button class="btn" id="btnTest">取得テスト</button>
        <button class="btn btn-primary" id="btnRegister">登録</button>
      </div>

      <!-- log -->
      <div class="log hidden" id="logBox">
        <pre id="logText"></pre>
      </div>
    </div>
  </div>

  <script>
    const sourceSelect = document.getElementById("sourceSelect");
    const commonFields = document.getElementById("commonFields");
    const formApi = document.getElementById("formApi");
    const formUrl = document.getElementById("formUrl");
    const formFile = document.getElementById("formFile");
    const actions = document.getElementById("actions");
    const logBox = document.getElementById("logBox");
    const logText = document.getElementById("logText");

    const preset = {
      api_kokkai: {
        type: "public_api",
        name: "国会会議録API（国会議事録）",
        endpoint: "https://kokkai.ndl.go.jp/api/meeting",
        params: { keyword: "AI", maximumRecords: 200 }
      },
      api_datago: {
        type: "public_api",
        name: "data.go.jp（政府オープンデータ）",
        endpoint: "https://www.data.go.jp/data/api/action/package_search",
        params: { q: "防災" }
      },
      api_jma: {
        type: "public_api",
        name: "気象庁（防災・気象）",
        endpoint: "https://www.jma.go.jp/bosai/forecast/data/forecast/130000.json",
        params: {}
      },
      url_egov: {
        type: "public_url",
        name: "e-Gov（法令・制度ページ）",
        url: "https://elaws.e-gov.go.jp/",
        mode: "html"
      },
      url_caa: {
        type: "public_url",
        name: "消費者庁（FAQページ）",
        url: "https://www.caa.go.jp/",
        mode: "html"
      },
      url_tokyo: {
        type: "public_url",
        name: "東京都（オープン情報ページ）",
        url: "https://www.metro.tokyo.lg.jp/",
        mode: "html"
      },
      file_upload: {
        type: "download",
        name: "ファイルアップロード（csv/txt/json）"
      }
    };

    function showOnly(kind) {
      commonFields.classList.remove("hidden");
      actions.classList.remove("hidden");

      formApi.classList.add("hidden");
      formUrl.classList.add("hidden");
      formFile.classList.add("hidden");

      if (kind === "api") formApi.classList.remove("hidden");
      if (kind === "url") formUrl.classList.remove("hidden");
      if (kind === "file") formFile.classList.remove("hidden");
    }

    function writeLog(obj) {
      logBox.classList.remove("hidden");
      const now = new Date().toISOString();
      logText.textContent =
        `[${now}] デモ実行\n` +
        JSON.stringify(obj, null, 2);
    }

    sourceSelect.addEventListener("change", () => {
      const key = sourceSelect.value;
      const p = preset[key];
      if (!p) return;

      // 共通：名称
      document.getElementById("sourceName").value = p.name || "";

      // 切替＆プリセット反映
      if (p.type === "public_api") {
        showOnly("api");
        document.getElementById("apiEndpoint").value = p.endpoint || "";
        document.getElementById("apiParams").value = JSON.stringify(p.params || {}, null, 2);
      } else if (p.type === "public_url") {
        showOnly("url");
        document.getElementById("targetUrl").value = p.url || "";
        document.getElementById("urlMode").value = p.mode || "html";
        document.getElementById("urlHint").value = "";
      } else {
        showOnly("file");
      }

      // ログはリセット
      logBox.classList.add("hidden");
      logText.textContent = "";
    });

    document.getElementById("btnTest").addEventListener("click", () => {
      if (!sourceSelect.value) return alert("先に取得元を選択してください。");
      writeLog(buildUnifiedRequest("test"));
    });

    document.getElementById("btnRegister").addEventListener("click", () => {
      if (!sourceSelect.value) return alert("先に取得元を選択してください。");
      writeLog(buildUnifiedRequest("register"));
    });

    function buildUnifiedRequest(action) {
      const key = sourceSelect.value;
      const p = preset[key];

      const base = {
        action,
        source_key: key,
        display_name: document.getElementById("sourceName").value.trim(),
        source_type: p.type,
      };

      if (p.type === "public_api") {
        let params = {};
        try { params = JSON.parse(document.getElementById("apiParams").value || "{}"); }
        catch (e) { params = { _parse_error: "params JSON parse failed" }; }

        return {
          ...base,
          endpoint: document.getElementById("apiEndpoint").value.trim(),
          schedule: document.getElementById("apiSchedule").value,
          params
        };
      }

      if (p.type === "public_url") {
        return {
          ...base,
          url: document.getElementById("targetUrl").value.trim(),
          mode: document.getElementById("urlMode").value,
          hint: document.getElementById("urlHint").value.trim()
        };
      }

      // download
      const f = document.getElementById("fileInput").files?.[0];
      return {
        ...base,
        file: f ? { name: f.name, size: f.size, type: f.type } : null
      };
    }
  </script>
</body>
</html>
