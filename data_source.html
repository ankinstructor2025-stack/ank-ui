<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>データ取得</title>

<link rel="stylesheet" href="./css/theme.css">

</head>
<body>

<div class="page">

  <div class="card">

    <div class="header-row">
      <h2>データ取得</h2>

      <div class="header-actions">
        <button id="btnMenu" class="btn">メニュー</button>
        <button id="btnLogout" class="btn">ログアウト</button>
      </div>
    </div>

    <!-- 共通パネル -->
    <div class="common-panel">

      <div class="common-grid">

        <div>
          <label>取得元</label>
          <select id="sourceSelect"></select>
        </div>

        <div>
          <label>名称</label>
          <input id="sourceName" readonly>
        </div>

      </div>

    </div>

    <!-- 作業パネル -->
    <div class="work-panel">

      <!-- 未選択 -->
      <div id="panelEmpty" class="placeholder">
        取得元を選択してください
      </div>

      <!-- 国会議事録 -->
      <div id="panelKokkai" class="hidden">

        <h3 class="panel-title">国会議事録取得</h3>

        <div class="compact-actions">
          <button id="btnKokkaiRegister" class="btn-primary">
            国会議事録取得
          </button>
        </div>

      </div>

      <!-- ファイル -->
      <div id="panelUpload" class="hidden">

        <h3 class="panel-title">ファイルアップロード</h3>

        <div class="section-block">

          <label>ファイル</label>
          <input id="uploadFileInput" type="file">

          <div class="compact-actions">
            <button id="btnUploadRegister" class="btn-primary">
              アップロード
            </button>
          </div>

        </div>

      </div>

      <!-- オープンデータ -->
      <div id="panelOpenData" class="hidden">

        <h3 class="panel-title">オープンデータ取得</h3>

        <div class="section-block">

          <div class="compact-actions">
            <button id="btnFetchDatasets" class="btn-primary">
              データセット取得
            </button>
          </div>

          <div class="dataset-list-wrap">
            <div id="openDataDatasetList" class="placeholder">
              まだ取得していません
            </div>
          </div>

        </div>

        <div class="section-block">

          <div class="selected-box" id="openDataSelectedDataset">
            未選択
          </div>

          <div class="compact-actions">
            <button id="btnFetchResources" class="btn">
              データセット分解
            </button>
          </div>

          <div class="resource-list-wrap">
            <div id="openDataResourceList" class="placeholder">
              まだ分解していません
            </div>
          </div>

        </div>

        <div class="section-block">

          <div class="selected-box" id="openDataSelectedResource">
            未選択
          </div>

          <div class="compact-actions">
            <button id="btnRegisterResource" class="btn-primary">
              データ登録
            </button>
          </div>

        </div>

      </div>

    </div>

    <!-- ログ -->
    <div class="log">

      <div class="log-head">
        <strong>ログ</strong>
        <button id="btnClearLog" class="btn">クリア</button>
      </div>

      <pre id="logText"></pre>

    </div>

  </div>

</div>

<script src="./data_source_upload.js"></script>
<script src="./data_source_kokkai.js"></script>
<script src="./data_source.js"></script>

</body>
</html>
