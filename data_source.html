<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>データ取り込み（デモ）</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="center-wrap">
    <div class="card">

      <div style="display:flex; align-items:center; justify-content:space-between;">
        <h1 style="margin:0;">
          データ取り込み（デモ）<span class="badge">ソース固定</span>
        </h1>

        <button class="btn" id="btnLogout" type="button">
          ログアウト
        </button>
      </div>

      <label for="sourceSelect">データ取得元を選択</label>
      <select id="sourceSelect">
        <option value="" selected disabled>読み込み中...</option>
      </select>
      <div class="subtitle">選択すると下の設定フォームが切り替わります（デモ）。</div>

      <div id="commonFields" class="hidden">
        <label for="sourceName">名称（表示名）</label>
        <input id="sourceName" placeholder="例）国会会議録（AI関連）" />
      </div>

      <div id="formApi" class="hidden">
        <div class="row">
          <div>
            <label for="apiEndpoint">パラメータ</label>
            <input id="apiEndpoint" />
          </div>
        </div>

        <label for="apiParams">パラメータ（JSON）</label>
        <textarea id="apiParams" placeholder='例）{"keyword":"AI","maximumRecords":200}'></textarea>
      </div>

      <div id="formUrl" class="hidden">
        <label for="targetUrl">パラメータ</label>
        <input id="targetUrl" placeholder="https://..." />

        <label for="urlMode">取得タイプ（デモ）</label>
        <select id="urlMode">
          <option value="html">HTML</option>
          <option value="json">JSON</option>
        </select>

        <label for="urlHint">抽出ヒント（任意）</label>
        <input id="urlHint" placeholder="例）FAQ / 見出し / 章タイトル など" />
      </div>

      <div id="formFile" class="hidden">
        <label for="fileInput">ファイル</label>
        <input id="uploadFileInput" type="file" accept=".csv,.txt,.json" />
        <div class="subtitle">PDF/画像は対象外（現方針）。</div>
      </div>

      <div class="actions hidden" id="actions">
        <button class="btn btn-primary" id="btnRegister" type="button">登録</button>
      </div>

      <div class="log hidden" id="logBox">
        <pre id="logText"></pre>
      </div>

    </div>
  </div>

  <script src="./data_source.js"></script>
</body>
</html>
