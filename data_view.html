<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>データ照会</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    .page-header {
      margin-bottom: 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .filter-wrap {
      margin: 16px 0 20px 0;
    }

    .table-wrap {
      overflow-x: auto;
      margin-top: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 10px 8px;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-weight: 600;
      white-space: nowrap;
    }

    td.content-cell {
      white-space: normal;
      word-break: break-word;
      line-height: 1.5;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .pager {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">

      <div class="page-header">
        <div>
          <h2>データ照会</h2>
          <div class="subtitle">row_data の一覧表示</div>
        </div>

        <div class="header-actions">
          <button class="btn" id="btnMenu" type="button">メニューに戻る</button>
          <button class="btn" id="btnLogout" type="button">ログアウト</button>
        </div>
      </div>

      <div class="filter-wrap">
        <label for="sourceTypeSelect">データ種別</label>
        <select id="sourceTypeSelect">
          <option value="">読み込み中...</option>
        </select>
        <div class="subtitle">選択したデータ種別で一覧を切り替えます</div>
      </div>

      <div class="table-wrap">
        <table>
          <thead id="data-table-head">
            <tr>
              <th style="width: 120px;">日付</th>
              <th style="width: 90px;">院</th>
              <th style="width: 180px;">会議名</th>
              <th style="width: 140px;">発言者</th>
              <th>発言内容</th>
            </tr>
          </thead>
          <tbody id="data-table-body">
            <tr>
              <td colspan="5">読み込み中...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="pager" id="pager">
        <button class="btn" id="prevPageBtn" type="button">前へ</button>
        <span id="pageInfo" class="subtitle">0 / 0</span>
        <button class="btn" id="nextPageBtn" type="button">次へ</button>
      </div>

    </div>
  </div>

  <script src="data_view.js"></script>
</body>
</html>
