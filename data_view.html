<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>データ照会</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    .page-header {
      margin-bottom: 16px;
    }

    .table-wrap {
      overflow-x: auto;
      margin-top: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 10px 8px;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-weight: 600;
    }

    td.content-cell {
      white-space: normal;
      word-break: break-word;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="page-header">
        <h2>データ照会</h2>
        <div class="subtitle">row_data の一覧表示</div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width: 80px;">No</th>
              <th>Content</th>
              <th style="width: 180px;">Created At</th>
            </tr>
          </thead>
          <tbody id="data-table-body">
            <tr>
              <td colspan="3">読み込み中...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="data_view.js"></script>
</body>
</html>
