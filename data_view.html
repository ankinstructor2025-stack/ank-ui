<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>データ照会</title>
<link rel="stylesheet" href="./theme.css">
<link rel="stylesheet" href="./data_view.css">
</head>

<body>
<div class="page">
  <div class="card">

    <div id="pageToolbar"></div>

    <div class="work-panel">
      <div class="section-block section-summary">
        <div class="compact-actions">
          <span id="selectionSummary" class="placeholder">選択 0 件</span>
          <span id="contextSummary" class="placeholder">親一覧</span>
        </div>
      </div>

      <div class="section-block section-lists">
        <div class="lists-grid">
          <div class="list-pane">
            <div class="compact-actions list-actions">
              <button id="btnParentCheckAll" class="btn btn-primary" type="button">全チェック</button>
              <button id="btnParentClearAll" class="btn btn-primary" type="button">全解除</button>
              <button id="btnKnowledge" class="btn btn-primary" type="button">選択対象をナレッジ化</button>
            </div>

            <div class="dataset-list-wrap">
              <table id="parentTable">
                <thead id="parentTableHead"></thead>
                <tbody id="parentTableBody"></tbody>
              </table>
            </div>

            <div id="parentPager" class="pager hidden"></div>
          </div>

          <div class="list-pane">
            <div class="list-pane-spacer" aria-hidden="true"></div>

            <div class="dataset-list-wrap">
              <table id="childTable">
                <thead id="childTableHead"></thead>
                <tbody id="childTableBody"></tbody>
              </table>
            </div>

            <div id="childPager" class="pager hidden"></div>
          </div>
        </div>
      </div>

      <div class="section-block section-detail">
        <h3 class="panel-title">詳細表示</h3>
        <div class="detail-wrap">
          <pre id="detailPre">データ種別を選択してください。</pre>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="./common_toolbar.js"></script>
<script src="./data_view_upload.js"></script>
<script src="./data_view_kokkai.js"></script>
<script src="./data_view_opendata.js"></script>
<script src="./data_view_public_url.js"></script>
<script src="./data_view.js"></script>

<script>
renderPageToolbar({
  mountId: "pageToolbar",
  title: "データ照会",
  showSourceSelect: true,
  showDbSelect: false,
  enableDbAutoLoad: false,
  actions: [
    { id: "btnMenu", label: "メニュー" },
    { id: "btnLogout", label: "ログアウト" }
  ]
});
</script>

</body>
</html>
