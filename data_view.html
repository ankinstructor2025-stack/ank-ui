<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>データ照会</title>
  <link rel="stylesheet" href="./theme.css" />
  <style>
    .page-note {
      margin: 0 0 12px 0;
      color: #ffffff;
      font-size: 14px;
    }

    .split-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 16px;
    }

    .panel-title {
      margin: 0 0 12px 0;
      font-size: 18px;
      font-weight: 700;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      color: #d1d5db;
      font-size: 14px;
    }

    .muted-text {
      color: #9ca3af;
      font-size: 13px;
    }

    .table-cell-link a {
      color: #bfdbfe;
      text-decoration: underline;
      word-break: break-all;
    }

    .status-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.5;
    }

    .status-new {
      background: rgba(59, 130, 246, 0.18);
      color: #bfdbfe;
    }

    .status-done {
      background: rgba(34, 197, 94, 0.18);
      color: #bbf7d0;
    }

    .status-error {
      background: rgba(239, 68, 68, 0.18);
      color: #fecaca;
    }

    .selected-row {
      background: rgba(59, 130, 246, 0.12);
    }

    .clickable-row {
      cursor: pointer;
    }

    .clickable-row:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .placeholder-row td {
      color: #9ca3af;
      text-align: center;
      padding: 16px;
    }

    .detail-pre {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.65;
      margin: 0;
      font-family: inherit;
    }

    .toolbar-right {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
    }

    .checkbox-cell {
      width: 48px;
      text-align: center;
    }

    .narrow-cell {
      width: 100px;
    }

    .medium-cell {
      width: 140px;
    }

    .name-display {
      width: 100%;
      box-sizing: border-box;
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      min-height: 42px;
      display: flex;
      align-items: center;
    }

    @media (max-width: 960px) {
      .split-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="page-header">
      <div>
        <h1>データ照会</h1>
        <p>親一覧 → 子一覧 → 詳細表示</p>
      </div>
      <div class="header-actions">
        <button id="btnBack" class="btn secondary">メニューに戻る</button>
        <button id="btnLogout" class="btn secondary">ログアウト</button>
      </div>
    </div>

    <div class="card">
      <div class="filter-wrap">
        <div class="form-group">
          <label for="sourceSelect">データ種別</label>
          <select id="sourceSelect">
            <option value="">読み込み中...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="sourceName">名称</label>
          <div id="sourceName" class="name-display"></div>
        </div>
      </div>

      <div class="table-toolbar">
        <div class="summary-row" style="margin:0;">
          <div>
            <span id="summaryText">0 件</span>
            <span id="selectionSummary" class="muted-text" style="margin-left:12px;">選択 0 件</span>
          </div>
          <div id="contextSummary" class="muted-text">親一覧</div>
        </div>

        <div class="toolbar-right">
          <button id="btnReload" class="btn secondary" type="button">再読込</button>
          <button id="btnKnowledge" class="btn primary" type="button" disabled>選択対象をナレッジ化</button>
        </div>
      </div>
    </div>

    <div class="split-grid">
      <div class="card">
        <h2 class="panel-title">親一覧</h2>
        <div class="table-wrap">
          <table class="data-table">
            <thead id="parentTableHead"></thead>
            <tbody id="parentTableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h2 class="panel-title">子一覧</h2>
        <div class="table-wrap">
          <table class="data-table">
            <thead id="childTableHead"></thead>
            <tbody id="childTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 class="panel-title">詳細表示</h2>
      <div class="detail-card">
        <pre id="detailPre" class="detail-pre">データ種別を選択してください。</pre>
      </div>
    </div>

  </div>

  <script src="./env.js"></script>
  <script src="./ank_firebase.js"></script>
  <script src="./firebase_auth.js"></script>
  <script src="./data_view.js"></script>
</body>
</html>
