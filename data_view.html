<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>データ照会</title>
<link rel="stylesheet" href="./theme.css">

<style>

*{
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
}

.page{
  width:100vw;
  height:100vh;
}

.card{
  width:100%;
  height:100%;
  padding:12px 20px;
  display:flex;
  flex-direction:column;
}

.header-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.page-note{
  margin-bottom:8px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.work-panel{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* 上下分割 */

.content-split{
  flex:1;
  display:grid;
  grid-template-rows:55% 10px 45%;
  overflow:hidden;
}

.top-section{
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.bottom-section{
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ドラッグバー */

.splitter-horizontal{
  background:#cbd5e1;
  cursor:row-resize;
}

/* 親子分割 */

.split-grid{
  flex:1;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  overflow:hidden;
}

.split-grid>div{
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* タイトル */

.panel-title-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
}

.panel-title{
  font-size:18px;
  font-weight:bold;
  margin:0;
}

/* ボタン */

.panel-title-actions{
  display:flex;
  gap:6px;
}

.btn-small{
  padding:4px 10px;
  font-size:12px;
  border:1px solid #94a3b8;
  background:#ffffff;
  cursor:pointer;
}

.btn-small:hover{
  background:#e2e8f0;
}

/* テーブル */

.table-wrap{
  flex:1;
  overflow:auto;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:8px;
}

.data-table{
  width:100%;
  border-collapse:collapse;
}

.data-table th,
.data-table td{
  padding:8px 10px;
  border-bottom:1px solid rgba(0,0,0,0.08);
  font-size:14px;
}

.data-table th{
  background:#e2e8f0;
  position:sticky;
  top:0;
}

.checkbox-cell{
  width:40px;
}

.narrow-cell{
  width:80px;
}

.medium-cell{
  width:120px;
}

.clickable-row{
  cursor:pointer;
}

.clickable-row:hover{
  background:#e0f2fe;
}

.selected-row{
  background:#bae6fd;
}

/* 詳細 */

.detail-wrap{
  flex:1;
  overflow:auto;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:8px;
  padding:12px;
}

.detail-pre{
  white-space:pre-wrap;
  font-family:Consolas,monospace;
}

</style>
</head>

<body>

<div class="page">
<div class="card">

<div class="header-row">
<h2>データ照会</h2>
<div>
<button id="btnMenu" class="btn">メニューに戻る</button>
<button id="btnLogout" class="btn">ログアウト</button>
</div>
</div>

<div class="page-note">
親一覧 → 子一覧 → 詳細表示
</div>

<div class="summary-row">
<div>
<span id="summaryText">0 件</span>
<span id="selectionSummary">選択 0 件</span>
</div>

<div>
<span id="contextSummary">親一覧</span>
<button id="btnReload" class="btn">再読込</button>
<button id="btnKnowledge" class="btn btn-primary" disabled>
選択対象をナレッジ化
</button>
</div>
</div>

<div class="work-panel">

<div id="contentSplit" class="content-split">

<div class="top-section">

<div class="split-grid">

<!-- 親一覧 -->

<div>

<div class="panel-title-row">

<div class="panel-title-actions">
<button id="btnParentCheckAll" class="btn-small">
全チェック
</button>

<button id="btnParentClearAll" class="btn-small">
全解除
</button>
</div>

<h3 class="panel-title">親一覧</h3>

</div>

<div class="table-wrap">

<table class="data-table">

<thead id="parentTableHead"></thead>

<tbody id="parentTableBody"></tbody>

</table>

</div>

</div>

<!-- 子一覧 -->

<div>

<h3 class="panel-title">子一覧</h3>

<div class="table-wrap">

<table class="data-table">

<thead id="childTableHead"></thead>

<tbody id="childTableBody"></tbody>

</table>

</div>

</div>

</div>

</div>

<div id="horizontalSplitter" class="splitter-horizontal"></div>

<!-- 詳細 -->

<div class="bottom-section">

<h3 class="panel-title">詳細表示</h3>

<div class="detail-wrap">

<pre id="detailPre" class="detail-pre">
データ種別を選択してください。
</pre>

</div>

</div>

</div>

</div>

</div>
</div>

<script src="./data_view_upload.js"></script>
<script src="./data_view_kokkai.js"></script>
<script src="./data_view_opendata.js"></script>
<script src="./data_view_public_url.js"></script>
<script src="./data_view.js"></script>

<script>

/* 親一覧 全チェック */

document.getElementById("btnParentCheckAll")
.addEventListener("click",()=>{

if(window.DataViewKokkai){
window.DataViewKokkai.checkAll()
}

})

/* 親一覧 全解除 */

document.getElementById("btnParentClearAll")
.addEventListener("click",()=>{

if(window.DataViewKokkai){
window.DataViewKokkai.clearAllChecks()
}

})

</script>

</body>
</html>
