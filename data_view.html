<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>データ照会</title>
<link rel="stylesheet" href="./theme.css">
</head>

<body>
<div class="page">
  <div class="card">

    <div id="pageToolbar"></div>

    <div class="work-panel">
      <div class="section-block">
        <div class="compact-actions">
          <span id="summaryText">0 件</span>
          <span id="selectionSummary" class="placeholder">選択 0 件</span>
          <span id="contextSummary" class="placeholder">親一覧</span>
          <button id="btnReload" class="btn" type="button">再読込</button>
          <button id="btnKnowledge" class="btn btn-primary" type="button" disabled>
            選択対象をナレッジ化
          </button>
        </div>
      </div>

      <div class="section-block">
        <div class="compact-actions">
          <h3 class="panel-title">親一覧</h3>
          <button id="btnParentCheckAll" class="btn" type="button">全チェック</button>
          <button id="btnParentClearAll" class="btn" type="button">全解除</button>
        </div>

        <div class="dataset-list-wrap">
          <table id="parentTable" style="width:100%; border-collapse:collapse;">
            <thead id="parentTableHead"></thead>
            <tbody id="parentTableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="section-block">
        <h3 class="panel-title">子一覧</h3>
        <div class="dataset-list-wrap">
          <table id="childTable" style="width:100%; border-collapse:collapse;">
            <thead id="childTableHead"></thead>
            <tbody id="childTableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="section-block">
        <h3 class="panel-title">詳細表示</h3>
        <div class="dataset-list-wrap">
          <pre id="detailPre">データ種別を選択してください。</pre>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="./common_toolbar.js"></script>
<script src="./data_view_upload.js"></script>
<script src="./data_view_kokkai.js"></script>
<script src="./data_view_opendata.js"></script>
<script src="./data_view_public_url.js"></script>
<script src="./data_view.js"></script>

<script>
renderPageToolbar({
  mountId: "pageToolbar",
  title: "データ照会",
  showSourceSelect: true,
  showDbSelect: false,
  enableDbAutoLoad: false,
  actions: [
    { id: "btnMenu", label: "メニュー" },
    { id: "btnLogout", label: "ログアウト" }
  ]
});
</script>

</body>
</html>
