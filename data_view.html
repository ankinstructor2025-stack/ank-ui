<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>データ照会</title>
<link rel="stylesheet" href="./theme.css">

<style>
  * {
    box-sizing: border-box;
  }

  :root {
    --splitter-size: 10px;
    --top-ratio: 55;
    --bottom-ratio: 45;
    --top-min: 180px;
    --bottom-min: 180px;
  }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  body {
    min-height: 100vh;
  }

  .page {
    width: 100vw !important;
    height: 100vh !important;
    max-width: none !important;
    margin: 0 !important;
    padding: 0 !important;
    display: block !important;
  }

  .card {
    width: 100vw !important;
    height: 100vh !important;
    max-width: none !important;
    margin: 0 !important;
    border-radius: 0 !important;
    padding: 12px 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header-row {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .page-note {
    flex: 0 0 auto;
    margin-bottom: 8px;
  }

  .common-panel {
    flex: 0 0 auto;
    margin-bottom: 10px;
  }

  .summary-row {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .muted-text {
    color: #9ca3af;
    font-size: 13px;
  }

  .work-panel {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .content-split {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-rows:
      minmax(0, calc(var(--top-ratio) * 1fr))
      var(--splitter-size)
      minmax(0, calc(var(--bottom-ratio) * 1fr));
    gap: 0;
    overflow: hidden;
  }

  .top-section,
  .bottom-section {
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .splitter-horizontal {
    position: relative;
    background: rgba(255,255,255,0.08);
    cursor: row-resize;
    user-select: none;
    transition: background 0.15s ease;
  }

  .splitter-horizontal:hover,
  .splitter-horizontal.dragging {
    background: rgba(96,165,250,0.45);
  }

  .splitter-horizontal::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 64px;
    height: 4px;
    transform: translate(-50%, -50%);
    border-radius: 999px;
    background: rgba(255,255,255,0.55);
  }

  .split-grid {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    overflow: hidden;
  }

  .split-grid > div {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-title {
    flex: 0 0 auto;
    margin: 0 0 8px 0;
    font-size: 18px;
    font-weight: 700;
  }

  .table-wrap {
    flex: 1 1 auto;
    min-height: 0;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    background: rgba(255,255,255,0.02);
  }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  .data-table th,
  .data-table td {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    text-align: left;
    vertical-align: top;
    font-size: 14px;
  }

  .data-table th {
    background: #d9dee7;
    position: sticky;
    top: 0;
    z-index: 2;
  }

  .checkbox-cell {
    width: 48px;
    text-align: center;
  }

  .narrow-cell {
    width: 100px;
  }

  .medium-cell {
    width: 140px;
  }

  .clickable-row {
    cursor: pointer;
  }

  .clickable-row:hover {
    background: rgba(255,255,255,0.05);
  }

  .selected-row {
    background: rgba(59,130,246,0.15);
  }

  .placeholder-row td {
    color: #9ca3af;
    text-align: center;
    padding: 16px;
  }

  .status-pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 9999px;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.5;
  }

  .status-new {
    background: rgba(59,130,246,0.18);
    color: #bfdbfe;
  }

  .status-done {
    background: rgba(34,197,94,0.18);
    color: #bbf7d0;
  }

  .status-error {
    background: rgba(239,68,68,0.18);
    color: #fecaca;
  }

  .table-cell-link a {
    color: #bfdbfe;
    text-decoration: underline;
    word-break: break-all;
  }

  .detail-wrap {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 12px 16px;
    background: rgba(255,255,255,0.02);
  }

  .detail-pre {
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.6;
    margin: 0;
    font-family: inherit;
  }

  #parentTableBody td,
  #childTableBody td {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  @media (max-width: 960px) {
    html, body {
      overflow: auto;
    }

    .page {
      width: 100%;
      height: auto;
      min-height: 100vh;
    }

    .card {
      width: 100%;
      height: auto;
      min-height: 100vh;
      padding: 10px 12px;
    }

    .content-split {
      display: block;
      overflow: visible;
    }

    .splitter-horizontal {
      display: none;
    }

    .top-section,
    .bottom-section {
      overflow: visible;
    }

    .split-grid {
      grid-template-columns: 1fr;
      overflow: visible;
    }

    .split-grid > div {
      overflow: visible;
    }

    .table-wrap {
      height: 260px;
      min-height: 260px;
    }

    .detail-wrap {
      min-height: 240px;
    }
  }
</style>
</head>

<body>
<div class="page">
  <div class="card">

    <div class="header-row">
      <h2>データ照会</h2>
      <div class="header-actions">
        <button id="btnMenu" class="btn">メニューに戻る</button>
        <button id="btnLogout" class="btn">ログアウト</button>
      </div>
    </div>

    <div class="page-note">
      親一覧 → 子一覧 → 詳細表示
    </div>

    <div class="common-panel">
      <div class="common-grid">
        <div>
          <label>データ種別</label>
          <select id="sourceSelect"></select>
        </div>
        <div>
          <label>名称</label>
          <input id="sourceName" readonly>
        </div>
      </div>
    </div>

    <div class="work-panel">
      <div class="summary-row">
        <div>
          <span id="summaryText">0 件</span>
          <span id="selectionSummary" class="muted-text" style="margin-left:12px;">選択 0 件</span>
        </div>
        <div>
          <span id="contextSummary" class="muted-text">親一覧</span>
          <button id="btnReload" class="btn" style="margin-left:12px;">再読込</button>
          <button id="btnKnowledge" class="btn btn-primary" disabled style="margin-left:8px;">
            選択対象をナレッジ化
          </button>
        </div>
      </div>

      <div id="contentSplit" class="content-split">
        <div class="top-section">
          <div class="split-grid">
            <div>
              <h3 class="panel-title">親一覧</h3>
              <div class="table-wrap">
                <table class="data-table">
                  <thead id="parentTableHead"></thead>
                  <tbody id="parentTableBody"></tbody>
                </table>
              </div>
            </div>

            <div>
              <h3 class="panel-title">子一覧</h3>
              <div class="table-wrap">
                <table class="data-table">
                  <thead id="childTableHead"></thead>
                  <tbody id="childTableBody"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

        <div id="horizontalSplitter" class="splitter-horizontal" title="上下の比率を変更"></div>

        <div class="bottom-section">
          <h3 class="panel-title">詳細表示</h3>
          <div class="detail-wrap">
            <pre id="detailPre" class="detail-pre">データ種別を選択してください。</pre>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="./data_view_upload.js"></script>
<script src="./data_view_kokkai.js"></script>
<script src="./data_view_opendata.js"></script>
<script src="./data_view_public_url.js"></script>
<script src="./data_view.js"></script>

<script>
(function () {
  const STORAGE_KEY = "data_view_vertical_split_ratio";
  const split = document.getElementById("contentSplit");
  const splitter = document.getElementById("horizontalSplitter");

  if (!split || !splitter) return;

  let dragging = false;

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function applyRatio(topPercent) {
    const safeTop = clamp(topPercent, 20, 80);
    const safeBottom = 100 - safeTop;

    split.style.gridTemplateRows = `${safeTop}fr var(--splitter-size) ${safeBottom}fr`;
    split.dataset.topRatio = String(safeTop);

    try {
      localStorage.setItem(STORAGE_KEY, String(safeTop));
    } catch (_) {}
  }

  function applyRatioFromPointer(clientY) {
    const rect = split.getBoundingClientRect();
    const splitterSize = splitter.getBoundingClientRect().height || 10;
    const usableHeight = rect.height - splitterSize;
    if (usableHeight <= 0) return;

    const topMin = 180;
    const bottomMin = 180;

    let topPx = clientY - rect.top;
    topPx = clamp(topPx, topMin, usableHeight - bottomMin);

    const topPercent = (topPx / usableHeight) * 100;
    applyRatio(topPercent);
  }

  function onPointerMove(event) {
    if (!dragging) return;
    applyRatioFromPointer(event.clientY);
  }

  function stopDragging() {
    if (!dragging) return;
    dragging = false;
    splitter.classList.remove("dragging");
    document.body.style.cursor = "";
    document.body.style.userSelect = "";
  }

  splitter.addEventListener("pointerdown", (event) => {
    if (window.matchMedia("(max-width: 960px)").matches) return;

    dragging = true;
    splitter.classList.add("dragging");
    document.body.style.cursor = "row-resize";
    document.body.style.userSelect = "none";
    splitter.setPointerCapture(event.pointerId);

    applyRatioFromPointer(event.clientY);
  });

  splitter.addEventListener("pointermove", onPointerMove);
  window.addEventListener("pointermove", onPointerMove);
  window.addEventListener("pointerup", stopDragging);
  window.addEventListener("pointercancel", stopDragging);
  window.addEventListener("blur", stopDragging);

  window.addEventListener("DOMContentLoaded", () => {
    let saved = 55;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw !== null && raw !== "") {
        const parsed = Number(raw);
        if (!Number.isNaN(parsed)) {
          saved = parsed;
        }
      }
    } catch (_) {}

    applyRatio(saved);
  });
})();
</script>

</body>
</html>
