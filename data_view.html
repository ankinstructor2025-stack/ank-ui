<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>データ照会</title>
  <link rel="stylesheet" href="./theme.css">
  <style>
    .split-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 16px;
    }

    .panel-title {
      margin: 0 0 12px 0;
      font-size: 18px;
      font-weight: 700;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      color: #d1d5db;
      font-size: 14px;
    }

    .muted-text {
      color: #9ca3af;
      font-size: 13px;
    }

    .table-wrap {
      max-height: 280px;
      overflow: auto;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
    }

    .data-table th,
    .data-table td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    .data-table th {
      background: rgba(255,255,255,0.04);
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .checkbox-cell {
      width: 48px;
      text-align: center;
    }

    .narrow-cell {
      width: 100px;
    }

    .medium-cell {
      width: 140px;
    }

    .clickable-row {
      cursor: pointer;
    }

    .clickable-row:hover {
      background: rgba(255,255,255,0.04);
    }

    .selected-row {
      background: rgba(59,130,246,0.12);
    }

    .placeholder-row td {
      color: #9ca3af;
      text-align: center;
      padding: 16px;
    }

    .status-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.5;
    }

    .status-new {
      background: rgba(59,130,246,0.18);
      color: #bfdbfe;
    }

    .status-done {
      background: rgba(34,197,94,0.18);
      color: #bbf7d0;
    }

    .status-error {
      background: rgba(239,68,68,0.18);
      color: #fecaca;
    }

    .table-cell-link a {
      color: #bfdbfe;
      text-decoration: underline;
      word-break: break-all;
    }

    .detail-wrap {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px 16px;
      min-height: 120px;
      max-height: 180px;
      overflow: auto;
      background: rgba(255,255,255,0.02);
    }

    .detail-pre {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      margin: 0;
      font-family: inherit;
    }

    @media (max-width: 960px) {
      .split-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="page">
  <div class="card">

    <div class="header-row">
      <h2>データ照会</h2>

      <div class="header-actions">
        <button id="btnMenu" class="btn" type="button">メニューに戻る</button>
        <button id="btnLogout" class="btn" type="button">ログアウト</button>
      </div>
    </div>

    <div class="page-note">
      親一覧 → 子一覧 → 詳細表示
    </div>

    <div class="common-panel">
      <div class="common-grid">
        <div>
          <label for="sourceSelect">データ種別</label>
          <select id="sourceSelect"></select>
        </div>

        <div>
          <label for="sourceName">名称</label>
          <input id="sourceName" readonly>
        </div>
      </div>
    </div>

    <div class="work-panel">

      <div class="summary-row">
        <div>
          <span id="summaryText">0 件</span>
          <span id="selectionSummary" class="muted-text" style="margin-left:12px;">選択 0 件</span>
        </div>

        <div>
          <span id="contextSummary" class="muted-text">親一覧</span>
          <button id="btnReload" class="btn" type="button" style="margin-left:12px;">再読込</button>
          <button id="btnKnowledge" class="btn btn-primary" type="button" disabled style="margin-left:8px;">
            選択対象をナレッジ化
          </button>
        </div>
      </div>

      <div class="split-grid">
        <div>
          <h3 class="panel-title">親一覧</h3>
          <div class="table-wrap">
            <table class="data-table">
              <thead id="parentTableHead"></thead>
              <tbody id="parentTableBody"></tbody>
            </table>
          </div>
        </div>

        <div>
          <h3 class="panel-title">子一覧</h3>
          <div class="table-wrap">
            <table class="data-table">
              <thead id="childTableHead"></thead>
              <tbody id="childTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div style="margin-top:16px;">
        <h3 class="panel-title">詳細表示</h3>
        <div class="detail-wrap">
          <pre id="detailPre" class="detail-pre">データ種別を選択してください。</pre>
        </div>
      </div>

    </div>

  </div>
</div>

<script src="./data_view_upload.js"></script>
<script src="./data_view_kokkai.js"></script>
<script src="./data_view_opendata.js"></script>
<script src="./data_view_public_url.js"></script>
<script src="./data_view.js"></script>

</body>
</html>
