<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>データ照会</title>
<link rel="stylesheet" href="./theme.css">

<style>
* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

body {
  min-height: 100vh;
}

.page {
  width: 100vw !important;
  height: 100vh !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  display: block !important;
}

.card {
  width: 100vw !important;
  height: 100vh !important;
  max-width: none !important;
  margin: 0 !important;
  border-radius: 0 !important;
  padding: 12px 20px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 上部固定領域 */
.header-row {
  flex: 0 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

.page-note {
  flex: 0 0 auto;
  margin-bottom: 8px;
}

.common-panel {
  flex: 0 0 auto;
  margin-bottom: 10px;
}

.summary-row {
  flex: 0 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}

/* 作業全体 */
.work-panel {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 上下 50:50 */
.content-split {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-rows: 1fr 1fr;
  gap: 12px;
  overflow: hidden;
}

/* 各段が縮めるようにする */
.top-section,
.bottom-section {
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 親子 50:50 */
.split-grid {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  overflow: hidden;
}

.split-grid > div {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.panel-title {
  flex: 0 0 auto;
  margin: 0 0 8px 0;
  font-size: 18px;
  font-weight: 700;
}

/* これが重要: 高さを親から受け取り、内部スクロール */
.table-wrap {
  flex: 1 1 auto;
  min-height: 0;
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  background: rgba(255,255,255,0.02);
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

.data-table th,
.data-table td {
  padding: 10px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  text-align: left;
  vertical-align: top;
  font-size: 14px;
}

.data-table th {
  background: #d9dee7;
  position: sticky;
  top: 0;
  z-index: 2;
}

.checkbox-cell {
  width: 48px;
  text-align: center;
}

.narrow-cell {
  width: 100px;
}

.medium-cell {
  width: 140px;
}

.clickable-row {
  cursor: pointer;
}

.clickable-row:hover {
  background: rgba(255,255,255,0.05);
}

.selected-row {
  background: rgba(59,130,246,0.15);
}

.placeholder-row td {
  color: #9ca3af;
  text-align: center;
  padding: 16px;
}

.status-pill {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 9999px;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.5;
}

.status-new {
  background: rgba(59,130,246,0.18);
  color: #bfdbfe;
}

.status-done {
  background: rgba(34,197,94,0.18);
  color: #bbf7d0;
}

.status-error {
  background: rgba(239,68,68,0.18);
  color: #fecaca;
}

.table-cell-link a {
  color: #bfdbfe;
  text-decoration: underline;
  word-break: break-all;
}

/* 下段詳細 */
.detail-wrap {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 12px 16px;
  background: rgba(255,255,255,0.02);
}

.detail-pre {
  white-space: pre-wrap;
  word-break: break-word;
  line-height: 1.6;
  margin: 0;
  font-family: inherit;
}

/* 親一覧は1行省略 */
#parentTableBody td {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 子一覧も横方向を使って省略 */
#childTableBody td {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

@media (max-width: 960px) {
  html, body {
    overflow: auto;
  }

  .page {
    width: 100%;
    height: auto;
    min-height: 100vh;
  }

  .card {
    width: 100%;
    height: auto;
    min-height: 100vh;
    padding: 10px 12px;
  }

  .content-split {
    display: block;
    overflow: visible;
  }

  .top-section,
  .bottom-section {
    overflow: visible;
  }

  .split-grid {
    grid-template-columns: 1fr;
    overflow: visible;
  }

  .split-grid > div {
    overflow: visible;
  }

  .table-wrap {
    height: 260px;
    min-height: 260px;
  }

  .detail-wrap {
    min-height: 240px;
  }
}
</style>
</head>

<body>
<div class="page">
  <div class="card">

    <div class="header-row">
      <h2>データ照会</h2>
      <div class="header-actions">
        <button id="btnMenu" class="btn">メニューに戻る</button>
        <button id="btnLogout" class="btn">ログアウト</button>
      </div>
    </div>

    <div class="page-note">
      親一覧 → 子一覧 → 詳細表示
    </div>

    <div class="common-panel">
      <div class="common-grid">
        <div>
          <label>データ種別</label>
          <select id="sourceSelect"></select>
        </div>
        <div>
          <label>名称</label>
          <input id="sourceName" readonly>
        </div>
      </div>
    </div>

    <div class="work-panel">
      <div class="summary-row">
        <div>
          <span id="summaryText">0 件</span>
          <span id="selectionSummary" style="margin-left:12px;">選択 0 件</span>
        </div>
        <div>
          <span id="contextSummary">親一覧</span>
          <button id="btnReload" class="btn" style="margin-left:12px;">再読込</button>
          <button id="btnKnowledge" class="btn btn-primary" disabled style="margin-left:8px;">
            選択対象をナレッジ化
          </button>
        </div>
      </div>

      <div class="content-split">
        <div class="top-section">
          <div class="split-grid">
            <div>
              <h3 class="panel-title">親一覧</h3>
              <div class="table-wrap">
                <table class="data-table">
                  <thead id="parentTableHead"></thead>
                  <tbody id="parentTableBody"></tbody>
                </table>
              </div>
            </div>

            <div>
              <h3 class="panel-title">子一覧</h3>
              <div class="table-wrap">
                <table class="data-table">
                  <thead id="childTableHead"></thead>
                  <tbody id="childTableBody"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

        <div class="bottom-section">
          <h3 class="panel-title">詳細表示</h3>
          <div class="detail-wrap">
            <pre id="detailPre" class="detail-pre">データ種別を選択してください。</pre>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="./data_view_upload.js"></script>
<script src="./data_view_kokkai.js"></script>
<script src="./data_view_opendata.js"></script>
<script src="./data_view_public_url.js"></script>
<script src="./data_view.js"></script>
</body>
</html>
