<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>データ照会</title>
<link rel="stylesheet" href="./theme_uirefresh.css">
</head>
<body>
<div class="page full-page">
  <div class="card full-card">
    <div class="header-row">
      <h2>データ照会</h2>
      <div class="header-actions">
        <button id="btnMenu" class="btn" type="button">メニューに戻る</button>
        <button id="btnLogout" class="btn" type="button">ログアウト</button>
      </div>
    </div>

    <div class="common-panel">
      <div class="common-grid">
        <div>
          <label for="sourceSelect">データ種別</label>
          <select id="sourceSelect"></select>
        </div>
        <div>
          <label for="sourceName">名称</label>
          <input id="sourceName" readonly>
        </div>
      </div>
    </div>

    <div class="work-panel">
      <div class="summary-row">
        <div>
          <span id="summaryText">0 件</span>
          <span id="selectionSummary" class="muted-text" style="margin-left:12px;">選択 0 件</span>
        </div>
        <div>
          <span id="contextSummary" class="muted-text">親一覧</span>
          <button id="btnReload" class="btn" type="button" style="margin-left:12px;">再読込</button>
          <button id="btnKnowledge" class="btn btn-primary" disabled type="button" style="margin-left:8px;">選択対象をナレッジ化</button>
        </div>
      </div>

      <div id="contentSplit" class="content-split">
        <div class="top-section">
          <div class="split-grid">
            <div>
              <div class="panel-title-row">
                <h3 class="panel-title">親一覧</h3>
                <div class="panel-title-actions">
                  <button id="btnParentCheckAll" class="btn btn-small" type="button">全チェック</button>
                  <button id="btnParentClearAll" class="btn btn-small" type="button">全解除</button>
                </div>
              </div>
              <div class="table-wrap">
                <table class="data-table">
                  <thead id="parentTableHead"></thead>
                  <tbody id="parentTableBody"></tbody>
                </table>
              </div>
            </div>

            <div>
              <h3 class="panel-title">子一覧</h3>
              <div class="table-wrap" id="childTableWrap">
                <table class="data-table child-data-table" id="childTable">
                  <thead id="childTableHead"></thead>
                  <tbody id="childTableBody"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

        <div id="horizontalSplitter" class="splitter-horizontal" title="上下の比率を変更"></div>

        <div class="bottom-section">
          <h3 class="panel-title">詳細表示</h3>
          <div class="detail-wrap">
            <pre id="detailPre" class="detail-pre">データ種別を選択してください。</pre>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="./data_view_upload.js"></script>
<script src="./data_view_kokkai.js"></script>
<script src="./data_view_opendata.js"></script>
<script src="./data_view_public_url.js"></script>
<script src="./data_view.js"></script>
<script>
(function () {
  const STORAGE_KEY = "data_view_vertical_split_ratio";
  const split = document.getElementById("contentSplit");
  const splitter = document.getElementById("horizontalSplitter");
  const btnParentCheckAll = document.getElementById("btnParentCheckAll");
  const btnParentClearAll = document.getElementById("btnParentClearAll");
  if (!split || !splitter) return;
  let dragging = false;
  function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
  function getKokkaiModule() { return window.DataViewKokkai || null; }
  function applyRatio(topPercent) {
    const safeTop = clamp(topPercent, 20, 80);
    const safeBottom = 100 - safeTop;
    split.style.gridTemplateRows = `${safeTop}fr 10px ${safeBottom}fr`;
    split.dataset.topRatio = String(safeTop);
    try { localStorage.setItem(STORAGE_KEY, String(safeTop)); } catch (_) {}
  }
  function applyRatioFromPointer(clientY) {
    const rect = split.getBoundingClientRect();
    const splitterSize = splitter.getBoundingClientRect().height || 10;
    const usableHeight = rect.height - splitterSize;
    if (usableHeight <= 0) return;
    let topPx = clientY - rect.top;
    topPx = clamp(topPx, 180, usableHeight - 180);
    const topPercent = (topPx / usableHeight) * 100;
    applyRatio(topPercent);
  }
  function onPointerMove(event) { if (!dragging) return; applyRatioFromPointer(event.clientY); }
  function stopDragging() {
    if (!dragging) return;
    dragging = false;
    splitter.classList.remove("dragging");
    document.body.style.cursor = "";
    document.body.style.userSelect = "";
  }
  splitter.addEventListener("pointerdown", (event) => {
    if (window.matchMedia("(max-width: 960px)").matches) return;
    dragging = true;
    splitter.classList.add("dragging");
    document.body.style.cursor = "row-resize";
    document.body.style.userSelect = "none";
    splitter.setPointerCapture(event.pointerId);
    applyRatioFromPointer(event.clientY);
  });
  splitter.addEventListener("pointermove", onPointerMove);
  window.addEventListener("pointermove", onPointerMove);
  window.addEventListener("pointerup", stopDragging);
  window.addEventListener("pointercancel", stopDragging);
  window.addEventListener("blur", stopDragging);
  splitter.addEventListener("dblclick", () => applyRatio(55));
  if (btnParentCheckAll) {
    btnParentCheckAll.addEventListener("click", () => {
      const module = getKokkaiModule();
      if (!module || typeof module.checkAll !== "function") return;
      module.checkAll();
    });
  }
  if (btnParentClearAll) {
    btnParentClearAll.addEventListener("click", () => {
      const module = getKokkaiModule();
      if (!module || typeof module.clearAllChecks !== "function") return;
      module.clearAllChecks();
    });
  }
  window.addEventListener("DOMContentLoaded", () => {
    let saved = 55;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw !== null && raw !== "") {
        const parsed = Number(raw);
        if (!Number.isNaN(parsed)) saved = parsed;
      }
    } catch (_) {}
    applyRatio(saved);
  });
})();
</script>
</body>
</html>
