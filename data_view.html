<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>データ照会</title>
  <link rel="stylesheet" href="./theme.css">
  <style>
    :root {
      --page-padding-y: 12px;
      --page-padding-x: 16px;
      --card-padding: 20px;
      --gap-md: 16px;
      --summary-height: 44px;
      --detail-title-height: 32px;
      --panel-title-height: 32px;
      --detail-min-height: 180px;
      --table-min-height: 220px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
    }

    .page {
      width: 100%;
      height: 100vh;
      padding: var(--page-padding-y) var(--page-padding-x);
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .card {
      width: min(1600px, 100%);
      height: calc(100vh - (var(--page-padding-y) * 2));
      display: flex;
      flex-direction: column;
      padding: var(--card-padding);
      overflow: hidden;
    }

    .header-row {
      flex: 0 0 auto;
      margin-bottom: 8px;
    }

    .page-note {
      flex: 0 0 auto;
      margin-bottom: 8px;
    }

    .common-panel {
      flex: 0 0 auto;
      margin-bottom: 10px;
    }

    .work-panel {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-title {
      margin: 0 0 8px 0;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
      min-height: var(--panel-title-height);
      display: flex;
      align-items: center;
    }

    .summary-row {
      flex: 0 0 auto;
      min-height: var(--summary-height);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      color: #d1d5db;
      font-size: 14px;
      flex-wrap: wrap;
    }

    .muted-text {
      color: #9ca3af;
      font-size: 13px;
    }

    .split-grid {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: start;
      margin-bottom: 12px;
    }

    .split-grid > div {
      min-width: 0;
    }

    .table-wrap {
      height: clamp(
        var(--table-min-height),
        calc(100vh - 460px),
        420px
      );
      overflow-y: auto;
      overflow-x: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .data-table th,
    .data-table td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    .data-table th {
      background: #d9dee7;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .checkbox-cell {
      width: 48px;
      text-align: center;
    }

    .narrow-cell {
      width: 100px;
    }

    .medium-cell {
      width: 140px;
    }

    .clickable-row {
      cursor: pointer;
    }

    .clickable-row:hover {
      background: rgba(255,255,255,0.04);
    }

    .selected-row {
      background: rgba(59,130,246,0.12);
    }

    .placeholder-row td {
      color: #9ca3af;
      text-align: center;
      padding: 16px;
    }

    .status-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.5;
    }

    .status-new {
      background: rgba(59,130,246,0.18);
      color: #bfdbfe;
    }

    .status-done {
      background: rgba(34,197,94,0.18);
      color: #bbf7d0;
    }

    .status-error {
      background: rgba(239,68,68,0.18);
      color: #fecaca;
    }

    .table-cell-link a {
      color: #bfdbfe;
      text-decoration: underline;
      word-break: break-all;
    }

    .detail-section {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .detail-wrap {
      flex: 1 1 auto;
      min-height: var(--detail-min-height);
      overflow: auto;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.02);
    }

    .detail-pre {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      margin: 0;
      font-family: inherit;
    }

    /* 親一覧は1行 */
    #parentTableBody td {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 子一覧も基本1行寄りにして横幅を活かす */
    #childTableBody td {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 960px) {
      html, body {
        overflow: auto;
      }

      .page {
        height: auto;
        min-height: 100vh;
        padding: 12px;
      }

      .card {
        height: auto;
        min-height: calc(100vh - 24px);
      }

      .split-grid {
        grid-template-columns: 1fr;
      }

      .table-wrap {
        height: 260px;
      }

      .detail-wrap {
        min-height: 220px;
      }
    }
  </style>
</head>
<body>

<div class="page">
  <div class="card">

    <div class="header-row">
      <h2>データ照会</h2>

      <div class="header-actions">
        <button id="btnMenu" class="btn" type="button">メニューに戻る</button>
        <button id="btnLogout" class="btn" type="button">ログアウト</button>
      </div>
    </div>

    <div class="page-note">
      親一覧 → 子一覧 → 詳細表示
    </div>

    <div class="common-panel">
      <div class="common-grid">
        <div>
          <label for="sourceSelect">データ種別</label>
          <select id="sourceSelect"></select>
        </div>

        <div>
          <label for="sourceName">名称</label>
          <input id="sourceName" readonly>
        </div>
      </div>
    </div>

    <div class="work-panel">

      <div class="summary-row">
        <div>
          <span id="summaryText">0 件</span>
          <span id="selectionSummary" class="muted-text" style="margin-left:12px;">選択 0 件</span>
        </div>

        <div>
          <span id="contextSummary" class="muted-text">親一覧</span>
          <button id="btnReload" class="btn" type="button" style="margin-left:12px;">再読込</button>
          <button id="btnKnowledge" class="btn btn-primary" type="button" disabled style="margin-left:8px;">
            選択対象をナレッジ化
          </button>
        </div>
      </div>

      <div class="split-grid">
        <div>
          <h3 class="panel-title">親一覧</h3>
          <div class="table-wrap">
            <table class="data-table">
              <thead id="parentTableHead"></thead>
              <tbody id="parentTableBody"></tbody>
            </table>
          </div>
        </div>

        <div>
          <h3 class="panel-title">子一覧</h3>
          <div class="table-wrap">
            <table class="data-table">
              <thead id="childTableHead"></thead>
              <tbody id="childTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="detail-section">
        <h3 class="panel-title">詳細表示</h3>
        <div class="detail-wrap">
          <pre id="detailPre" class="detail-pre">データ種別を選択してください。</pre>
        </div>
      </div>

    </div>

  </div>
</div>

<script src="./data_view_upload.js"></script>
<script src="./data_view_kokkai.js"></script>
<script src="./data_view_opendata.js"></script>
<script src="./data_view_public_url.js"></script>
<script src="./data_view.js"></script>

</body>
</html>
