<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>データ照会</title>

<link rel="stylesheet" href="./theme.css">

<style>

*{
  box-sizing:border-box;
}

/* ===== 画面全体 ===== */

html,body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
}

/* ===== 外側の濃いブルー帯を消す ===== */

.page{
  width:100vw !important;
  height:100vh !important;
  max-width:none !important;
  margin:0 !important;
  padding:0 !important;
  display:block !important;
}

/* ===== メインカードを画面全幅に ===== */

.card{
  width:100vw !important;
  height:100vh !important;
  max-width:none !important;
  margin:0 !important;

  border-radius:0 !important;

  padding:16px 20px;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}

/* ===== 上部 ===== */

.header-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.page-note{
  margin-bottom:8px;
}

/* ===== 作業エリア ===== */

.work-panel{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ===== 件数行 ===== */

.summary-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

/* ===== 上下50% ===== */

.content-split{
  flex:1;
  display:grid;
  grid-template-rows:1fr 1fr;
  gap:12px;
  min-height:0;
}

/* ===== 親子50% ===== */

.split-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  min-height:0;
}

/* ===== テーブル ===== */

.table-wrap{
  flex:1;
  overflow:auto;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:12px;
}

.data-table{
  width:100%;
  border-collapse:collapse;
}

.data-table th,
.data-table td{
  padding:10px 12px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}

.data-table th{
  background:#d9dee7;
  position:sticky;
  top:0;
  z-index:2;
}

/* ===== 行 hover ===== */

.clickable-row{
  cursor:pointer;
}

.clickable-row:hover{
  background:rgba(255,255,255,0.05);
}

.selected-row{
  background:rgba(59,130,246,0.15);
}

/* ===== 詳細 ===== */

.detail-wrap{
  flex:1;
  overflow:auto;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:12px;
  padding:12px 16px;
}

.detail-pre{
  white-space:pre-wrap;
  word-break:break-word;
}

/* ===== 文字省略 ===== */

#parentTableBody td,
#childTableBody td{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

</style>

</head>

<body>

<div class="page">
<div class="card">

<div class="header-row">

<h2>データ照会</h2>

<div class="header-actions">
<button id="btnMenu" class="btn">メニューに戻る</button>
<button id="btnLogout" class="btn">ログアウト</button>
</div>

</div>

<div class="page-note">
親一覧 → 子一覧 → 詳細表示
</div>

<div class="common-panel">

<div class="common-grid">

<div>
<label>データ種別</label>
<select id="sourceSelect"></select>
</div>

<div>
<label>名称</label>
<input id="sourceName" readonly>
</div>

</div>

</div>

<div class="work-panel">

<div class="summary-row">

<div>
<span id="summaryText">0 件</span>
<span id="selectionSummary">選択 0 件</span>
</div>

<div>

<span id="contextSummary">親一覧</span>

<button id="btnReload" class="btn">
再読込
</button>

<button id="btnKnowledge" class="btn btn-primary" disabled>
選択対象をナレッジ化
</button>

</div>

</div>


<div class="content-split">

<!-- 上半分 -->

<div>

<div class="split-grid">

<div>

<h3>親一覧</h3>

<div class="table-wrap">

<table class="data-table">
<thead id="parentTableHead"></thead>
<tbody id="parentTableBody"></tbody>
</table>

</div>

</div>

<div>

<h3>子一覧</h3>

<div class="table-wrap">

<table class="data-table">
<thead id="childTableHead"></thead>
<tbody id="childTableBody"></tbody>
</table>

</div>

</div>

</div>

</div>


<!-- 下半分 -->

<div>

<h3>詳細表示</h3>

<div class="detail-wrap">

<pre id="detailPre" class="detail-pre">
データ種別を選択してください。
</pre>

</div>

</div>

</div>

</div>

</div>
</div>


<script src="./data_view_upload.js"></script>
<script src="./data_view_kokkai.js"></script>
<script src="./data_view_opendata.js"></script>
<script src="./data_view_public_url.js"></script>
<script src="./data_view.js"></script>

</body>
</html>
