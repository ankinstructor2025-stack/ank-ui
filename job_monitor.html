<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ジョブ監視</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    .jm-page{
      width:100%;
      min-height:100vh;
      margin:0;
      padding:16px;
    }

    .jm-card{
      width:100%;
      min-height:calc(100vh - 32px);
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    .jm-wrap{
      display:flex;
      flex-direction:column;
      gap:12px;
      width:100%;
      max-width:1280px;
      margin:0 auto;
    }

    .jm-header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
    }

    .jm-title h2{
      margin:0 0 6px 0;
      font-size:22px;
    }

    .jm-title .subtitle{
      color:#dbe5f0;
      font-size:14px;
      line-height:1.5;
    }

    .jm-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .jm-panel{
      background:var(--panel-bg);
      border:1px solid var(--panel-border);
      border-radius:14px;
      overflow:hidden;
      color:var(--panel-text);
    }

    .jm-panel-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:12px;
      border-bottom:1px solid var(--panel-border);
      background:linear-gradient(180deg, #eef3f8 0%, #e3eaf3 100%);
    }

    .jm-panel-title{
      font-size:15px;
      font-weight:700;
      color:#334155;
    }

    .jm-summary{
      padding:10px 12px;
      border-bottom:1px solid var(--panel-border);
      background:#f7f9fc;
      color:#334155;
      font-size:13px;
    }

    .jm-layout{
      display:grid;
      grid-template-columns:360px 1fr;
      gap:12px;
      align-items:start;
    }

    .jm-queue-list{
      display:flex;
      flex-direction:column;
      gap:8px;
      padding:12px;
      max-height:620px;
      overflow:auto;
      background:#f8fafc;
    }

    .jm-queue-item{
      width:100%;
      text-align:left;
      padding:12px;
      border:1px solid #cbd5e1;
      border-radius:12px;
      background:#fff;
      color:#0f172a;
      cursor:pointer;
    }

    .jm-queue-item:hover{
      background:#f1f5f9;
    }

    .jm-queue-item.active{
      border-color:#2563eb;
      background:#dbeafe;
    }

    .jm-queue-name{
      font-weight:700;
      font-size:14px;
      margin-bottom:6px;
      word-break:break-all;
    }

    .jm-queue-meta{
      font-size:12px;
      color:#475569;
      line-height:1.6;
    }

    .jm-table-wrap{
      overflow:auto;
      background:#fff;
    }

    .jm-table{
      width:100%;
      border-collapse:collapse;
      background:#fff;
      color:#0f172a;
    }

    .jm-table th,
    .jm-table td{
      padding:10px 12px;
      border-bottom:1px solid #dbe3ee;
      text-align:left;
      font-size:14px;
      vertical-align:top;
      white-space:nowrap;
    }

    .jm-table th{
      background:#eef3f8;
      color:#334155;
      font-size:12px;
      font-weight:700;
    }

    .jm-table td.jm-col-url,
    .jm-table td.jm-col-name{
      white-space:normal;
      min-width:220px;
      word-break:break-all;
    }

    .jm-status{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:90px;
      padding:4px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
      border:1px solid transparent;
    }

    .jm-status-queued{
      background:#e2e8f0;
      color:#334155;
      border-color:#cbd5e1;
    }

    .jm-status-running{
      background:#dbeafe;
      color:#1d4ed8;
      border-color:#93c5fd;
    }

    .jm-status-retry{
      background:#fef3c7;
      color:#92400e;
      border-color:#fcd34d;
    }

    .jm-status-error{
      background:#fee2e2;
      color:#b91c1c;
      border-color:#fca5a5;
    }

    .jm-empty{
      padding:24px;
      color:#64748b;
      font-size:14px;
      background:#fff;
    }

    .jm-log{
      min-height:120px;
      max-height:180px;
      overflow:auto;
      padding:12px;
      background:#031228;
      color:#e5e7eb;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size:12px;
      line-height:1.6;
      white-space:pre-wrap;
    }

    @media (max-width:980px){
      .jm-header{
        flex-direction:column;
      }

      .jm-layout{
        grid-template-columns:1fr;
      }

      .jm-queue-list{
        max-height:260px;
      }
    }
  </style>
</head>
<body>
  <div class="jm-page">
    <div class="card jm-card">
      <div class="jm-wrap">

        <div class="jm-header">
          <div class="jm-title">
            <h2>ジョブ監視</h2>
            <div class="subtitle">
              Cloud Tasks のキュー一覧を表示します。キューを選択すると、そのキューに残っているタスク一覧を確認できます。
            </div>
          </div>
          <div class="jm-actions">
            <button class="btn" id="btn-back-menu" type="button">メニュー</button>
            <button class="btn btn-primary" id="btn-refresh" type="button">再読込</button>
          </div>
        </div>

        <div class="jm-layout">

          <div class="jm-panel">
            <div class="jm-panel-head">
              <div class="jm-panel-title">キュー一覧</div>
            </div>
            <div class="jm-summary" id="queueSummary">キュー件数: 0</div>
            <div class="jm-queue-list" id="queueList">
              <div class="jm-empty">まだキューはありません。</div>
            </div>
          </div>

          <div class="jm-panel">
            <div class="jm-panel-head">
              <div class="jm-panel-title" id="taskPanelTitle">タスク一覧</div>
            </div>
            <div class="jm-summary" id="taskSummary">タスク件数: 0</div>
            <div class="jm-table-wrap">
              <table class="jm-table">
                <thead>
                  <tr>
                    <th>状態</th>
                    <th>タスク名</th>
                    <th>スケジュール</th>
                    <th>試行回数</th>
                    <th>レスポンス回数</th>
                    <th>URL</th>
                  </tr>
                </thead>
                <tbody id="taskTableBody">
                  <tr>
                    <td colspan="6" class="jm-empty">キューを選択してください。</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

        </div>

        <div class="jm-log" id="jobLog">[job_monitor] ready</div>

      </div>
    </div>
  </div>

  <script src="job_monitor.js"></script>
</body>
</html>
