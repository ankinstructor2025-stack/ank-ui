<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ナレッジ作成</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    .page {
      width: 100%;
      max-width: 1680px;
      margin: 0 auto;
      padding: 20px;
      box-sizing: border-box;
    }

    .kc-card {
      width: 100%;
      min-height: calc(100vh - 40px);
      box-sizing: border-box;
    }

    .kc-wrap {
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 100%;
    }

    .kc-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .kc-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .kc-sub {
      color: rgba(255, 255, 255, 0.72);
      font-size: 12px;
      margin-top: 6px;
    }

    .kc-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 12px;
    }

    .kc-counts {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .kc-main {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      align-items: start;
      margin-bottom: 18px;
    }

    .kc-panel-title {
      margin: 0 0 10px 0;
      font-size: 16px;
      font-weight: 700;
      color: #111827;
    }

    .kc-panel {
      background: #eef2f7;
      border: 1px solid #d7dee8;
      border-radius: 12px;
      padding: 14px;
      min-height: 360px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .kc-table-wrap {
      flex: 1;
      min-height: 0;
      overflow: auto;
    }

    .kc-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .kc-table th,
    .kc-table td {
      padding: 10px 8px;
      border-bottom: 1px solid #d7dee8;
      text-align: left;
      font-size: 14px;
      color: #1f2937;
      vertical-align: middle;
      word-break: break-word;
    }

    .kc-table th {
      color: #6b7280;
      font-weight: 600;
      font-size: 13px;
      background: #eef2f7;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .kc-table tr:last-child td {
      border-bottom: none;
    }

    .col-source-type {
      width: 160px;
    }

    .col-status {
      width: 140px;
    }

    .col-count {
      width: 120px;
    }

    .col-action {
      width: 180px;
    }

    @media (max-width: 980px) {
      .page {
        padding: 12px;
      }

      .kc-card {
        min-height: auto;
      }

      .kc-main {
        grid-template-columns: 1fr;
      }

      .kc-panel {
        min-height: 260px;
      }

      .col-source-type,
      .col-status,
      .col-count,
      .col-action {
        width: auto;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card kc-card">
      <div class="kc-wrap">
        <div class="kc-header">
          <div>
            <h1 style="margin:0;">ナレッジ作成</h1>
            <div class="kc-sub">正常終了ジョブ一覧</div>
          </div>

          <div class="kc-actions">
            <button id="btnMenu" class="btn" type="button">メニューに戻る</button>
            <button id="btnLogout" class="btn" type="button">ログアウト</button>
          </div>
        </div>

        <div class="kc-topline">
          <div class="kc-counts">
            <span id="summaryText">0 件</span>
          </div>
          <div>
            <span id="contextSummary">正常終了ジョブ一覧</span>
          </div>
        </div>

        <div class="kc-main">
          <section class="kc-panel">
            <h2 class="kc-panel-title">正常終了ジョブ一覧</h2>
            <div class="kc-table-wrap">
              <table class="kc-table">
                <thead id="parentTableHead"></thead>
                <tbody id="parentTableBody"></tbody>
              </table>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <script src="knowledge_create.js"></script>
</body>
</html>
