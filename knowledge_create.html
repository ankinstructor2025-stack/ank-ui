<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ナレッジ作成</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    .kc-wrap {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .kc-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .kc-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .kc-sub {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
    }

    .kc-card {
      min-height: 560px;
    }

    .kc-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 12px;
    }

    .kc-counts {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .kc-main {
      display: grid;
      grid-template-columns: 7fr 3fr;
      gap: 18px;
      align-items: start;
      margin-bottom: 18px;
    }

    .kc-panel-title {
      margin: 0 0 10px 0;
      font-size: 16px;
      font-weight: 700;
      color: #111827;
    }

    .kc-panel {
      background: #eef2f7;
      border: 1px solid #d7dee8;
      border-radius: 12px;
      padding: 14px;
      min-height: 140px;
    }

    .kc-detail {
      background: #eef2f7;
      border: 1px solid #d7dee8;
      border-radius: 12px;
      padding: 14px;
      min-height: 250px;
    }

    .kc-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .kc-table th,
    .kc-table td {
      padding: 10px 8px;
      border-bottom: 1px solid #d7dee8;
      text-align: left;
      font-size: 14px;
      color: #1f2937;
      vertical-align: top;
    }

    .kc-table th {
      color: #6b7280;
      font-weight: 600;
      font-size: 13px;
    }

    .kc-table tr:last-child td {
      border-bottom: none;
    }

    .clickable-row {
      cursor: pointer;
    }

    .clickable-row:hover {
      background: #e5edf8;
    }

    .selected-row {
      background: #dbe8fb;
    }

    .kc-process-col {
      width: 200px;
      min-width: 200px;
    }

    .kc-process-btn {
      width: 100%;
      min-height: 40px;
      white-space: nowrap;
      word-break: keep-all;
      writing-mode: horizontal-tb;
    }

    .kc-child-no {
      width: 56px;
      color: #6b7280;
      white-space: nowrap;
    }

    .kc-child-title {
      word-break: break-word;
      line-height: 1.5;
    }

    .kc-pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.7;
      color: #1f2937;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
    }

    .kc-placeholder {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
      padding: 8px 2px;
    }

    @media (max-width: 980px) {
      .kc-main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card kc-card">
      <div class="kc-wrap">
        <div class="kc-header">
          <div>
            <h1 style="margin:0;">ナレッジ作成</h1>
            <div class="kc-sub">親一覧 → 子一覧 → 詳細表示</div>
          </div>

          <div class="kc-actions">
            <button id="btnMenu" class="btn" type="button">メニューに戻る</button>
            <button id="btnLogout" class="btn" type="button">ログアウト</button>
          </div>
        </div>

        <div class="kc-topline">
          <div class="kc-counts">
            <span id="summaryText">0 件</span>
            <span id="selectionSummary">子 0 件</span>
          </div>
          <div>
            <span id="contextSummary">親一覧</span>
            <button id="btnReload" class="btn" type="button" style="margin-left:12px;">再読込</button>
          </div>
        </div>

        <div class="kc-main">
          <section class="kc-panel">
            <h2 class="kc-panel-title">親一覧</h2>
            <table class="kc-table">
              <thead id="parentTableHead"></thead>
              <tbody id="parentTableBody"></tbody>
            </table>
          </section>

          <section class="kc-panel">
            <h2 class="kc-panel-title">子一覧</h2>
            <table class="kc-table">
              <thead id="childTableHead"></thead>
              <tbody id="childTableBody"></tbody>
            </table>
          </section>
        </div>

        <section class="kc-detail">
          <h2 class="kc-panel-title">詳細表示</h2>
          <pre id="detailPre" class="kc-pre">親一覧から1件選択してください</pre>
        </section>
      </div>
    </div>
  </div>

  <script src="knowledge_create.js"></script>
</body>
</html>
