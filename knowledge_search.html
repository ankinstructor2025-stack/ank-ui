<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ナレッジ検索</title>
<link rel="stylesheet" href="./theme.css">

<style>

.search-panel{
margin-top:12px;
border:1px solid rgba(255,255,255,0.08);
border-radius:16px;
padding:16px;
background:rgba(255,255,255,0.02);
}

.search-grid{
display:grid;
grid-template-columns:1fr 1.4fr auto;
gap:12px;
align-items:end;
}

.panel-title{
margin:0 0 12px 0;
font-size:18px;
font-weight:700;
}

.summary-row{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
margin-bottom:12px;
color:#d1d5db;
font-size:14px;
flex-wrap:wrap;
}

.muted-text{
color:#9ca3af;
font-size:13px;
}

.work-panel{
margin-top:16px;
}

.tabs-wrap{
margin-top:12px;
}

.tabs-header{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:12px;
}

.tab-btn{
appearance:none;
border:1px solid rgba(255,255,255,0.12);
background:rgba(255,255,255,0.03);
color:#d1d5db;
padding:10px 14px;
border-radius:10px;
cursor:pointer;
font-size:14px;
font-weight:600;
}

.tab-btn:hover{
background:rgba(255,255,255,0.06);
}

.tab-btn.active{
background:rgba(59,130,246,0.22);
border-color:rgba(59,130,246,0.60);
color:#ffffff;
}

.tab-panel{
display:none;
border:1px solid rgba(255,255,255,0.08);
border-radius:12px;
padding:14px;
background:rgba(255,255,255,0.02);
min-height:320px;
}

.tab-panel.active{
display:block;
}

.result-box{
border:1px solid rgba(255,255,255,0.08);
border-radius:12px;
background:rgba(255,255,255,0.02);
min-height:260px;
max-height:420px;
overflow:auto;
padding:12px;
}

.result-empty{
color:#9ca3af;
white-space:pre-wrap;
line-height:1.7;
}

.result-card{
border:1px solid rgba(255,255,255,0.08);
border-radius:10px;
padding:12px;
margin-bottom:10px;
background:rgba(255,255,255,0.02);
}

.result-card:last-child{
margin-bottom:0;
}

.result-card-title{
font-size:15px;
font-weight:700;
margin-bottom:6px;
color:#ffffff;
}

.result-card-sub{
font-size:12px;
color:#9ca3af;
margin-bottom:8px;
}

.result-card-body{
white-space:pre-wrap;
word-break:break-word;
line-height:1.6;
font-size:14px;
color:#e5e7eb;
}

#queryText{
width:100%;
resize:vertical;
min-height:72px;
line-height:1.5;
padding:8px 10px;
box-sizing:border-box;
}

@media (max-width:960px){

.search-grid{
grid-template-columns:1fr;
}

.tabs-header{
gap:6px;
}

.tab-btn{
width:100%;
text-align:left;
}

}

</style>
</head>

<body>

<div class="page">
  <div class="card">

    <div class="header-row">
      <h2>ナレッジ検索</h2>

      <div class="header-actions">
        <button id="btnMenu" class="btn">メニューに戻る</button>
        <button id="btnLogout" class="btn">ログアウト</button>
      </div>
    </div>

    <div class="search-panel">
      <div class="search-grid">

        <div>
          <label for="databaseSelect">データベース選択</label>
          <select id="databaseSelect"></select>
        </div>

        <div>
          <label for="queryText">検索文字列</label>
          <textarea id="queryText" rows="3" placeholder="検索文字列（複数行OK）"></textarea>
        </div>

        <div>
          <button id="btnSearch" class="btn btn-primary">検索</button>
        </div>

      </div>
    </div>

    <div class="work-panel">

      <div class="summary-row">
        <div>
          <span id="summaryText">0 件</span>
          <span id="selectionSummary" class="muted-text" style="margin-left:12px;">未実行</span>
        </div>

        <div>
          <span id="contextSummary" class="muted-text">検索結果</span>
          <button id="btnReload" class="btn" style="margin-left:12px;">再読込</button>
        </div>
      </div>

      <div class="tabs-wrap">

        <div class="tabs-header">
          <button class="tab-btn active" data-tab="qa_similarity">QA類似</button>
          <button class="tab-btn" data-tab="plain_fts">プレインFTS</button>
          <button class="tab-btn" data-tab="hybrid">両方</button>
          <button class="tab-btn" data-tab="hybrid_ai">両方＋AI整理</button>
        </div>

        <div id="panel-qa_similarity" class="tab-panel active">
          <h3 class="panel-title">QA類似</h3>
          <div id="resultQaSimilarity" class="result-box">
            <div class="result-empty">まだ結果はありません。</div>
          </div>
        </div>

        <div id="panel-plain_fts" class="tab-panel">
          <h3 class="panel-title">プレインFTS</h3>
          <div id="resultPlainFts" class="result-box">
            <div class="result-empty">まだ結果はありません。</div>
          </div>
        </div>

        <div id="panel-hybrid" class="tab-panel">
          <h3 class="panel-title">両方</h3>
          <div id="resultHybrid" class="result-box">
            <div class="result-empty">まだ結果はありません。</div>
          </div>
        </div>

        <div id="panel-hybrid_ai" class="tab-panel">
          <h3 class="panel-title">両方＋AI整理</h3>
          <div id="resultHybridAi" class="result-box">
            <div class="result-empty">まだ結果はありません。</div>
          </div>
        </div>

      </div>

    </div>

  </div>
</div>

<script src="./knowledge_search.js"></script>

</body>
</html>
