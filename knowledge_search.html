<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ナレッジ検索</title>
<link rel="stylesheet" href="theme_video.css">
</head>
<body>
<div class="page page-full">
  <div class="card">
    <div class="header-row">
      <div>
        <h2>ナレッジ検索</h2>
        <div class="page-lead">作成したナレッジを横断検索し、検索結果、回答候補、AI整理結果を見比べます。</div>
      </div>
      <div class="header-actions">
        <button id="btnMenu" class="btn" type="button">メニュー</button>
        <button id="btnLogout" class="btn" type="button">ログアウト</button>
      </div>
    </div>

    <div class="common-panel search-panel">
      <div class="search-grid">
        <div class="search-col">
          <label for="sourceSelect">データ種別</label>
          <select id="sourceSelect"></select>
        </div>
        <div class="search-col">
          <label for="dbSelect">ナレッジDB</label>
          <select id="dbSelect" disabled>
            <option value="">選択してください</option>
          </select>
        </div>
        <div class="search-col">
          <label for="queryInput">検索内容</label>
          <textarea id="queryInput" placeholder="検索したい内容を入力してください"></textarea>
        </div>
        <div class="search-button-col">
          <button id="btnSearch" class="btn btn-primary" type="button">検索</button>
        </div>
      </div>
    </div>

    <div class="summary-bar">
      <div class="summary-item"><span id="dbSummary">ナレッジDB未選択</span></div>
      <div class="summary-item"><span id="resultSummary">検索前</span></div>
      <div class="summary-item"><span id="statusSummary">待機中</span></div>
    </div>

    <div class="tabs-header">
      <button id="tabQaSimilar" class="tab-btn active" type="button">QA類似</button>
      <button id="tabPlainFts" class="tab-btn" type="button">プレインFTS</button>
      <button id="tabHybrid" class="tab-btn" type="button">ハイブリッド</button>
      <button id="tabAiAnswer" class="tab-btn" type="button">AI整理</button>
    </div>

    <div class="kv-content-split">
      <div class="kv-left-section">
        <div class="kv-list-header">
          <h3 class="kv-panel-title">検索結果</h3>
        </div>
        <div class="kv-table-wrap">
          <div id="resultArea">検索条件を指定してください。</div>
        </div>
      </div>
      <div class="kv-right-section">
        <h3 class="kv-panel-title">詳細表示</h3>
        <div class="kv-detail-wrap">
          <pre id="detailArea" class="kv-detail-pre">検索結果を選択すると内容を表示します。</pre>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="knowledge_search.js"></script>
</body>
</html>
