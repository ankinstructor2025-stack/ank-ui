<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ナレッジ照会</title>
<link rel="stylesheet" href="./theme.css">

<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  body {
    min-height: 100vh;
  }

  @media (max-width: 960px) {
    html, body {
      overflow: auto;
    }
  }
</style>
</head>

<body>
<div class="page kv-page">
  <div class="card kv-card">

    <div class="header-row">
      <h2>ナレッジ照会</h2>
      <div class="header-actions">
        <button id="btnMenu" class="btn">メニューに戻る</button>
        <button id="btnLogout" class="btn">ログアウト</button>
      </div>
    </div>

    <div class="kv-page-note">
      データ種別 → ナレッジDB選択 → QA / PLAIN 一覧 → 詳細表示
    </div>

    <div class="common-panel">
      <div class="common-grid">
        <div>
          <label>データ種別</label>
          <select id="sourceSelect"></select>
        </div>
        <div>
          <label>ナレッジDB</label>
          <select id="dbSelect" disabled>
            <option value="">選択してください</option>
          </select>
        </div>
      </div>
    </div>

    <div class="work-panel kv-work-panel">
      <div class="kv-summary-row">
        <div>
          <span id="summaryText">0 件</span>
          <span id="selectionSummary" class="kv-muted" style="margin-left:12px;">未選択</span>
        </div>
        <div>
          <span id="contextSummary" class="kv-muted">ナレッジ一覧</span>
          <button id="btnReload" class="btn" style="margin-left:12px;">再読込</button>
        </div>
      </div>

      <div class="kv-tabs-row">
        <button id="tabQa" class="kv-tab-btn active" type="button">QA</button>
        <button id="tabPlain" class="kv-tab-btn" type="button">PLAIN</button>
      </div>

      <div class="kv-content-split">
        <div class="kv-left-section">
          <div class="kv-list-header">
            <h3 class="kv-panel-title">ナレッジ一覧</h3>
            <div class="kv-paging-top">
              <button id="btnPrevPage" class="kv-pager-btn" type="button">前へ</button>
              <span id="pageInfo" class="kv-page-info">1 / 1</span>
              <button id="btnNextPage" class="kv-pager-btn" type="button">次へ</button>
              <span id="pagingSummary" class="kv-muted">0 / 0 ページ</span>
            </div>
          </div>

          <div class="kv-table-wrap">
            <table class="kv-data-table">
              <thead id="listTableHead"></thead>
              <tbody id="listTableBody"></tbody>
            </table>
          </div>
        </div>

        <div class="kv-right-section">
          <h3 class="kv-panel-title">詳細表示</h3>
          <div class="kv-detail-wrap">
            <div class="kv-detail-head">
              <div class="kv-detail-key">DB</div>
              <div id="detailDbName" class="kv-detail-value">-</div>

              <div class="kv-detail-key">種別</div>
              <div id="detailKnowledgeType" class="kv-detail-value">-</div>
            </div>
            <pre id="detailPre" class="kv-detail-pre">データ種別とナレッジDBを選択してください。</pre>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="./knowledge_view.js"></script>
</body>
</html>
