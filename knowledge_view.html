<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ナレッジ照会</title>
<link rel="stylesheet" href="./theme.css">
<style>
  .kv-page{
    width:100%;
    min-height:100vh;
    margin:0;
    padding:0;
  }

  .kv-card{
    width:100%;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .kv-work-panel{
    display:flex;
    flex-direction:column;
    gap:10px;
    min-height:calc(100vh - 74px);
    padding:0;
  }

  .kv-summary-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:10px 14px;
    border:1px solid var(--panel-border);
    border-radius:14px;
    background:rgba(255,255,255,.08);
    color:#fff;
  }

  .kv-summary-meta,
  .kv-summary-right{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    min-width:0;
  }

  .kv-muted{
    color:rgba(255,255,255,.78);
    font-size:13px;
  }

  .kv-btn-inline{
    min-width:96px;
    height:38px;
    padding:0 14px;
  }

  .kv-tabs-row{
    display:flex;
    gap:8px;
  }

  .kv-tab-btn{
    min-width:120px;
    height:42px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:12px;
    background:rgba(255,255,255,.08);
    color:#fff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }

  .kv-tab-btn:hover{
    background:rgba(255,255,255,.14);
  }

  .kv-tab-btn.active{
    background:linear-gradient(180deg,#1d4ed8,#1e40af);
    border-color:#1d4ed8;
    color:#fff;
    box-shadow:0 6px 16px rgba(37,99,235,.28);
  }

  .kv-content-split{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:minmax(420px, 48%) minmax(480px, 1fr);
    gap:10px;
  }

  .kv-left-section,
  .kv-right-section{
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
    border:1px solid var(--panel-border);
    border-radius:16px;
    background:var(--panel-bg);
    overflow:hidden;
  }

  .kv-list-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    min-height:42px;
    padding:0 14px;
    border-bottom:1px solid var(--panel-border);
    background:linear-gradient(180deg,#eef3f8 0%, #e3eaf3 100%);
  }

  .kv-panel-title{
    margin:0;
    color:var(--panel-text);
    font-size:15px;
    font-weight:700;
  }

  .kv-list,
  .kv-detail{
    flex:1;
    min-height:0;
    overflow:auto;
    background:var(--box-bg);
  }

  .kv-placeholder-box{
    margin:14px;
    padding:16px 18px;
    border:1px dashed #b6c2d2;
    border-radius:12px;
    background:#ffffff;
    color:#475569;
    font-size:14px;
  }

  .kv-item-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:12px;
  }

  .kv-item-card{
    width:100%;
    text-align:left;
    border:1px solid #d4dbe6;
    border-radius:14px;
    background:#fff;
    padding:12px 14px;
    color:var(--panel-text);
    cursor:pointer;
    box-shadow:0 1px 2px rgba(15,23,42,.04);
  }

  .kv-item-card:hover{
    border-color:#8db4ff;
    box-shadow:0 6px 16px rgba(37,99,235,.12);
  }

  .kv-item-card.is-selected{
    border-color:#2563eb;
    box-shadow:0 0 0 2px rgba(37,99,235,.12);
    background:#f5f9ff;
  }

  .kv-item-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
    font-size:12px;
  }

  .kv-item-id{
    color:#1d4ed8;
    font-weight:700;
    word-break:break-all;
  }

  .kv-item-sort,
  .kv-item-meta{
    color:#64748b;
    white-space:nowrap;
  }

  .kv-item-block + .kv-item-block{
    margin-top:10px;
  }

  .kv-item-label,
  .kv-detail-label{
    margin-bottom:6px;
    color:#475569;
    font-size:12px;
    font-weight:700;
  }

  .kv-item-text{
    color:#0f172a;
    font-size:14px;
    line-height:1.6;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
    word-break:break-word;
  }

  .kv-detail-card,
  .kv-detail-empty{
    padding:14px;
    color:var(--panel-text);
  }

  .kv-detail-head{
    display:grid;
    gap:8px;
    margin-bottom:14px;
    padding:12px;
    border:1px solid #d8e1eb;
    border-radius:12px;
    background:#fff;
  }

  .kv-detail-head-row{
    display:grid;
    grid-template-columns:64px 1fr;
    gap:8px;
    align-items:start;
  }

  .kv-detail-head-label{
    color:#64748b;
    font-size:12px;
    font-weight:700;
  }

  .kv-detail-head-value{
    color:#0f172a;
    font-size:14px;
    font-weight:600;
    word-break:break-all;
  }

  .kv-detail-section + .kv-detail-section{
    margin-top:12px;
  }

  .kv-detail-section{
    padding:12px;
    border:1px solid #d8e1eb;
    border-radius:12px;
    background:#fff;
  }

  .kv-detail-meta{
    margin-bottom:8px;
    color:#64748b;
    font-size:12px;
    font-weight:700;
  }

  .kv-detail-pre{
    margin:0;
    color:#0f172a;
    background:transparent;
    font-family:inherit;
    font-size:14px;
    line-height:1.7;
    white-space:pre-wrap;
    word-break:break-word;
  }

  @media (max-width: 1100px){
    .kv-content-split{
      grid-template-columns:1fr;
    }

    .kv-left-section{
      min-height:320px;
    }

    .kv-right-section{
      min-height:320px;
    }
  }

  @media (max-width: 720px){
    .kv-summary-row{
      flex-direction:column;
      align-items:flex-start;
    }

    .kv-tabs-row{
      flex-wrap:wrap;
    }

    .kv-tab-btn{
      flex:1 1 140px;
    }
  }
</style>
</head>

<body>
<div class="page kv-page">
  <div class="card kv-card">

    <div id="pageToolbar"></div>

    <div class="work-panel kv-work-panel">
      <div class="kv-summary-row">
        <div class="kv-summary-meta">
          <span id="summaryText">0 件</span>
          <span id="selectionSummary" class="kv-muted">未選択</span>
        </div>

        <div class="kv-summary-right">
          <span id="contextSummary" class="kv-muted">ナレッジ一覧</span>
          <button id="btnReload" class="btn kv-btn-inline" type="button">再読込</button>
        </div>
      </div>

      <div class="kv-tabs-row">
        <button id="tabQa" class="kv-tab-btn active" type="button">QA</button>
        <button id="tabPlain" class="kv-tab-btn" type="button">PLAIN</button>
      </div>

      <div class="kv-content-split">
        <div class="kv-left-section">
          <div class="kv-list-header">
            <h3 class="kv-panel-title">ナレッジ一覧</h3>
          </div>
          <div id="listContainer" class="kv-list"></div>
        </div>

        <div class="kv-right-section">
          <div class="kv-list-header">
            <h3 class="kv-panel-title">詳細</h3>
          </div>
          <div id="detailContainer" class="kv-detail"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="./common_toolbar.js"></script>
<script src="./knowledge_view.js"></script>
<script>
renderPageToolbar({
  mountId: "pageToolbar",
  title: "ナレッジ照会",
  showSourceSelect: true,
  showDbSelect: true,
  enableDbAutoLoad: true,
  actions: [
    { id: "btnMenu", label: "メニュー" },
    { id: "btnLogout", label: "ログアウト" }
  ]
});
</script>
</body>
</html>
