<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ナレッジ照会</title>
<link rel="stylesheet" href="./theme.css">
<style>
  .kv-page{
    width:100%;
    min-height:100vh;
    margin:0;
    padding:0;
  }

  .kv-card{
    width:100%;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .kv-work-panel{
    display:flex;
    flex-direction:column;
    gap:8px;
    min-height:calc(100vh - 74px);
    padding:0;
  }

  .kv-tabs-row{
    display:flex;
    gap:8px;
  }

  .kv-tab-btn{
    min-width:120px;
    height:42px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:12px;
    background:rgba(255,255,255,.08);
    color:#fff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }

  .kv-tab-btn:hover{
    background:rgba(255,255,255,.14);
  }

  .kv-tab-btn.active{
    background:linear-gradient(180deg,#1d4ed8,#1e40af);
    border-color:#1d4ed8;
    color:#fff;
    box-shadow:0 6px 16px rgba(37,99,235,.28);
  }

  .kv-list-section{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    border:1px solid var(--panel-border);
    border-radius:16px;
    background:var(--panel-bg);
    overflow:hidden;
  }

  .kv-list-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    min-height:38px;
    padding:6px 12px;
    border-bottom:1px solid var(--panel-border);
    background:linear-gradient(180deg,#eef3f8 0%, #e3eaf3 100%);
  }

  .kv-panel-title{
    margin:0;
    color:var(--panel-text);
    font-size:14px;
    font-weight:700;
  }

  .kv-btn-inline{
    min-width:96px;
    height:34px;
    padding:0 14px;
  }

  .kv-list{
    flex:1;
    min-height:0;
    overflow:auto;
    background:var(--box-bg);
    padding:6px;
  }

  .kv-placeholder-box{
    margin:2px;
    padding:12px 14px;
    border:1px dashed #b6c2d2;
    border-radius:10px;
    background:#ffffff;
    color:#475569;
    font-size:14px;
  }

  .kv-item-list{
    display:flex;
    flex-direction:column;
    gap:4px;
  }

  .kv-item-card{
    border:1px solid #d4dbe6;
    border-radius:10px;
    background:#fff;
    padding:6px 10px;
    color:var(--panel-text);
    box-shadow:0 1px 2px rgba(15,23,42,.04);
  }

  .kv-item-top{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:8px;
    margin-bottom:2px;
    font-size:11px;
  }

  .kv-item-sort{
    color:#64748b;
    white-space:nowrap;
  }

  .kv-line{
    display:flex;
    gap:6px;
    align-items:flex-start;
    font-size:14px;
    line-height:1.4;
    color:#0f172a;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .kv-line + .kv-line{
    margin-top:2px;
  }

  .kv-line-label{
    flex:0 0 auto;
    color:#475569;
    font-weight:700;
  }

  .kv-line-text{
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .kv-pagination{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    border-top:1px solid var(--panel-border);
    background:#f8fafc;
  }

  .kv-page-info{
    color:#334155;
    font-size:13px;
    min-width:72px;
    text-align:center;
  }

  .kv-page-btn{
    min-width:88px;
    height:36px;
    padding:0 12px;
    border:1px solid #1d4ed8;
    border-radius:10px;
    background:linear-gradient(180deg,#1d4ed8,#1e40af);
    color:#fff;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(37,99,235,.22);
  }

  .kv-page-btn:hover{
    background:linear-gradient(180deg,#2563eb,#1d4ed8);
  }

  .kv-page-btn[disabled]{
    opacity:.45;
    cursor:not-allowed;
    background:linear-gradient(180deg,#1d4ed8,#1e40af);
    color:#fff;
  }

  @media (max-width: 720px){
    .kv-tabs-row{
      flex-wrap:wrap;
    }

    .kv-tab-btn{
      flex:1 1 140px;
    }

    .kv-pagination{
      justify-content:center;
      flex-wrap:wrap;
    }
  }
</style>
</head>

<body>
<div class="page kv-page">
  <div class="card kv-card">

    <div id="pageToolbar"></div>

    <div class="work-panel kv-work-panel">
      <div class="kv-tabs-row">
        <button id="tabQa" class="kv-tab-btn active" type="button">QA</button>
        <button id="tabPlain" class="kv-tab-btn" type="button">PLAIN</button>
      </div>

      <div class="kv-list-section">
        <div class="kv-list-header">
          <h3 class="kv-panel-title">ナレッジ一覧</h3>
          <button id="btnReload" class="btn kv-btn-inline" type="button">再読込</button>
        </div>

        <div id="listContainer" class="kv-list"></div>

        <div class="kv-pagination">
          <button id="btnPrevPage" class="kv-page-btn" type="button">前へ</button>
          <span id="paginationInfo" class="kv-page-info">1 / 1</span>
          <button id="btnNextPage" class="kv-page-btn" type="button">次へ</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="./common_toolbar.js"></script>
<script src="./knowledge_view.js"></script>
<script>
renderPageToolbar({
  mountId: "pageToolbar",
  title: "ナレッジ照会",
  showSourceSelect: true,
  showDbSelect: true,
  enableDbAutoLoad: true,
  actions: [
    { id: "btnMenu", label: "メニュー" },
    { id: "btnLogout", label: "ログアウト" }
  ]
});
</script>
</body>
</html>
