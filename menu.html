<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>機能メニュー</title>
<link rel="stylesheet" href="./theme.css">
</head>
<body>

<div class="menu-container">

  <button class="logout-btn">ログアウト</button>

  <h1>機能メニュー</h1>
  <div class="menu-desc">
    用途ごとに整理しています。動画でも読みやすい構成にしています。
  </div>

  <div class="menu-item">
    <button class="menu-button">データ取込</button>
    <div class="menu-text">
      公開API、公開URL、アップロードファイルから元データを取り込みます。
    </div>
  </div>

  <div class="menu-item">
    <button class="menu-button">データ照会</button>
    <div class="menu-text">
      取得済みデータの件数、状態、内容を一覧で確認します。
    </div>
  </div>

  <div class="menu-item">
    <button class="menu-button">ナレッジ作成</button>
    <div class="menu-text">
      取り込んだデータからQAや説明文を生成します。
    </div>
  </div>

  <div class="menu-item">
    <button class="menu-button">ナレッジ照会</button>
    <div class="menu-text">
      作成済みナレッジをQAとPLAINで確認します。
    </div>
  </div>

  <div class="menu-item">
    <button class="menu-button">ナレッジ検索</button>
    <div class="menu-text">
      検索結果・回答候補・AI整理結果を比較できます。
    </div>
  </div>
</div>
<script src="./menu.js"></script>
</body>
</html>
