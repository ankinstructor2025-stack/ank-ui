<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>QA Generate (Debug)</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 24px; }
    .box { border: 1px solid #ddd; border-radius: 10px; padding: 16px; max-width: 720px; }
    .row { display: grid; grid-template-columns: 160px 1fr; gap: 8px; padding: 6px 0; }
    .k { color: #555; }
    .v { word-break: break-all; }
    #status { margin: 12px 0; padding: 10px; border-radius: 8px; background: #f6f6f6; }
    .err { background: #ffecec; }
    button { padding: 8px 12px; }
  </style>
</head>
<body>
  <h1>QA Generate (Debug)</h1>

  <div id="status">loading...</div>

  <div class="box">
    <div class="row"><div class="k">user_id</div><div class="v" id="user_id">-</div></div>
    <div class="row"><div class="k">account_id</div><div class="v" id="account_id">-</div></div>
    <div class="row"><div class="k">tenant_id</div><div class="v" id="tenant_id">-</div></div>
    <div class="row"><div class="k">plan_id</div><div class="v" id="plan_id">-</div></div>
  </div>

  <p style="margin-top:16px;">
    <button id="btnReload">再取得</button>
  </p>

  <pre id="raw" style="white-space:pre-wrap; margin-top:16px;"></pre>

  <script type="module" src="./qa_generate.js"></script>
</body>
</html>
